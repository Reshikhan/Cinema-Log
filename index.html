<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>Reshi Studio — Video Editor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ffffff; --bg2:#f2f2f7; --card:#ffffff; --line:#e5e5ea;
  --txt:#000000; --mut:#8e8e93; --acc:#ff9f43; --blue:#007aff;
  --shadow:0 2px 12px rgba(0,0,0,.08);
}
body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-user-select:none;user-select:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
/* ============ HOME ============ */
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
.hd{display:flex;align-items:center;padding:18px 0 4px}
.hd .logo{width:38px;height:38px;border-radius:12px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;margin-right:10px}
.hd h1{margin:0;font-size:1.5rem;font-weight:800}
.hd .sp{flex:1}
.sub{color:var(--mut);font-size:.8rem;margin:4px 0 16px}
.ccard{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#3a3a44,#1a1a20);min-height:170px;display:flex;align-items:flex-end;box-shadow:var(--shadow);border:none;width:100%;text-align:left;padding:0;color:#fff}
.ccard .tx{padding:16px;color:#fff}
.ccard .k{font-size:.65rem;letter-spacing:2px;color:#ffd9a8;font-weight:700}
.ccard h2{margin:4px 0;font-size:1.4rem}
.ccard p{margin:0;color:#c7c7cc;font-size:.8rem}
.cplay{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--acc);border:none;color:#fff;font-size:1.4rem}
.hbtns{display:flex;gap:10px;margin:14px 0 20px}
.hbtns button{flex:1;border:none;border-radius:24px;padding:15px;font-size:.95rem;font-weight:700}
.rec{background:var(--acc);color:#fff}
.newp{background:var(--bg2);color:var(--txt)}
.ph{display:flex;align-items:center;margin-bottom:10px}
.ph h2{margin:0;font-size:1.2rem}
.ph .sp{flex:1}
.ph .recent{color:var(--mut);font-size:.85rem;background:none;border:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--bg2);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:none;padding:0;text-align:left}
.pcard .th{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#d1d1d6,#a8a8b0);display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;overflow:hidden}
.pcard .th img{width:100%;height:100%;object-fit:cover}
.pcard .dots{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:.9rem}
.pcard .nm{padding:8px 10px 2px;font-weight:700;font-size:.85rem;color:var(--txt)}
.pcard .mt{padding:0 10px 10px;color:var(--mut);font-size:.75rem}
.empty{text-align:center;color:var(--mut);padding:40px 0;font-size:.9rem}
/* ============ EDITOR ============ */
#editor{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:20px}
.tbar{display:flex;align-items:center;gap:8px;padding:12px}
.bk{width:38px;height:38px;border-radius:50%;background:var(--bg2);border:none;font-size:1.1rem;color:var(--txt)}
.tt{flex:1;min-width:0}
.tt b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{color:var(--mut);font-size:.72rem}
.ur{background:var(--bg2);border:none;border-radius:18px;padding:8px 12px;color:var(--mut);font-size:1rem}
.ur:on{color:var(--txt)}
.exp{background:var(--acc);color:#fff;border:none;border-radius:20px;padding:10px 22px;font-weight:700;font-size:.9rem}
.pvwrap{position:relative;background:#000;margin:0 12px;border-radius:12px;overflow:hidden}
.pvwrap canvas{width:100%;display:block;max-height:46vh;object-fit:contain;background:#000}
.pills{position:absolute;top:10px;left:10px;display:flex;gap:8px}
.pill{background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:16px;padding:7px 12px;font-size:.78rem}
.tl{padding:10px 12px}
.tlrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tlrow .time{font-size:.8rem;color:var(--mut);font-variant-numeric:tabular-nums}
.playb{width:44px;height:44px;border-radius:50%;background:var(--bg2);border:none;font-size:1.1rem;color:var(--txt);flex-shrink:0}
.ruler{position:relative;height:22px;flex:1;overflow:hidden}
.ruler span{position:absolute;transform:translateX(-50%);font-size:.65rem;color:var(--mut)}
.strip{position:relative;height:64px;background:var(--bg2);border-radius:10px;overflow:hidden;display:flex}
.clip{position:relative;height:100%;border-radius:8px;overflow:hidden;background:#c7c7cc;flex-shrink:0;margin-right:2px}
.clip img{width:100%;height:100%;object-fit:cover}
.clip.sel{outline:2px solid var(--acc);outline-offset:-2px}
.phead{position:absolute;top:-6px;bottom:-6px;width:2px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.5);pointer-events:none;z-index:5}
.phead::before{content:'';position:absolute;top:-4px;left:-5px;border:6px solid transparent;border-top:8px solid #fff}
.addbtn{width:52px;min-width:52px;height:64px;border-radius:10px;background:var(--bg2);border:1px dashed var(--line);font-size:1.4rem;color:var(--mut)}
.clipinfo{display:flex;align-items:center;padding:8px 12px;font-size:.8rem}
.clipinfo .dot{color:var(--acc);margin-right:6px}
.clipinfo b{color:var(--acc);font-weight:700}
.clipinfo .sp{flex:1}
.desel{background:none;border:none;color:var(--mut);font-size:.85rem}
.ctools{display:flex;justify-content:space-around;padding:6px 4px 10px}
.ctool{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.68rem;color:var(--txt);padding:6px 4px;min-width:56px}
.ctool .ic{font-size:1.3rem}
/* ============ BOTTOM SHEET ============ */
.sheet2{background:var(--bg2);border-radius:24px 24px 0 0;margin:0 8px;padding:6px 0 10px;box-shadow:0 -2px 16px rgba(0,0,0,.06)}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 10px}
.ptitle{display:flex;align-items:center;padding:4px 16px 10px}
.ptitle .pic{font-size:1.1rem;margin-right:8px}
.ptitle h3{margin:0;font-size:1.05rem;flex:1}
.seg{display:flex;background:rgba(0,0,0,.06);border-radius:16px;padding:3px}
.seg button{border:none;background:none;padding:7px 14px;border-radius:13px;font-size:.8rem;color:var(--mut)}
.seg button.on{background:#fff;color:var(--txt);font-weight:600;box-shadow:var(--shadow)}
.rndbtn{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.06);border:none;font-size:1rem;margin-left:8px;color:var(--txt)}
.pbody{padding:0 16px;max-height:38vh;overflow-y:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:16px;padding:8px 16px;font-size:.82rem;color:var(--txt)}
.chip.on{background:var(--txt);color:#fff;border-color:var(--txt)}
.row2{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row2 .lab{font-size:.88rem;font-weight:600}
.row2 .val{margin-left:auto;font-size:.88rem;color:var(--mut)}
.srow{display:flex;align-items:center;gap:12px;padding:10px 2px}
.srow .lab{font-size:.85rem;width:90px;flex-shrink:0}
.srow input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--acc) var(--p,50%),#e5e5ea var(--p,50%));outline:none}
.srow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25);border:none}
.srow .num{font-size:.85rem;width:44px;text-align:right;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:var(--shadow)}
.stepper button{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg2);font-size:1.1rem;color:var(--txt)}
.stepper b{font-size:.9rem;min-width:70px;text-align:center}
/* looks grid */
.lookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 0 10px}
.look{border:2px solid transparent;border-radius:12px;overflow:hidden;background:#fff;padding:0;position:relative}
.look.on{border-color:var(--acc)}
.look .lt{aspect-ratio:1;background:linear-gradient(135deg,#d1d1d6,#8e8e93);font-size:1.6rem;display:flex;align-items:center;justify-content:center;color:#fff}
.look .ln{font-size:.7rem;padding:6px 4px;text-align:center;color:var(--txt)}
.look .hdr{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:.6rem;border-radius:6px;padding:2px 6px}
/* wheels */
.wheels{display:flex;justify-content:space-around;padding:10px 0}
.wheel{text-align:center}
.wheel canvas{width:96px;height:96px;border-radius:50%;touch-action:none}
.wheel .wl{font-size:.75rem;font-weight:600;margin:6px 0 2px}
.wheel .ll{font-size:.7rem;color:var(--mut)}
/* tab bar */
.tabbar{display:flex;background:var(--bg2);border-radius:24px;margin:10px 12px 0;padding:6px}
.tab{flex:1;border:none;background:none;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;color:var(--mut)}
.tab .ic{font-size:1.25rem}
.tab.on{background:#fff;color:var(--txt);font-weight:700;box-shadow:var(--shadow)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal .box{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.modal h3{margin:0 0 14px;font-size:1.1rem}
.modal input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:1rem;margin-bottom:16px;outline:none}
.modal input:focus{border-color:var(--blue)}
.modal .btns{display:flex;gap:10px}
.modal .btns button{flex:1;padding:13px;border-radius:12px;font-size:1rem;font-weight:600;border:none}
.modal .cancel{background:var(--bg2);color:var(--txt)}
.modal .go{background:var(--blue);color:#fff}
.sheetm{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheetm .box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:20px 20px 34px;max-height:70vh;overflow-y:auto}
.sheetm h3{margin:0 0 14px}
.bigbtn{display:block;width:100%;padding:15px;border:none;border-radius:14px;background:var(--blue);color:#fff;font-size:1rem;font-weight:700;margin-bottom:10px}
.bigbtn.ghost{background:var(--bg2);color:var(--txt)}
.prog{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;background:var(--acc);width:0%;border-radius:4px;transition:width .2s}
.help{color:var(--mut);font-size:.85rem;text-align:center;padding:20px 10px;line-height:1.5}
input[type=file]{display:none}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<div id="home">
  <div class="wrap">
    <div class="hd">
      <div class="logo">✂️</div>
      <h1>Reshi Studio</h1>
      <div class="sp"></div>
    </div>
    <div class="sub">21 looks · record 4K 60 HDR · smooth slow motion</div>

    <button class="ccard" id="continueCard" style="display:none">
      <div class="tx">
        <div class="k">CONTINUE EDITING</div>
        <h2 id="ccName">—</h2>
        <p id="ccMeta">—</p>
      </div>
      <div class="cplay">▶</div>
    </button>

    <div class="hbtns">
      <button class="rec" id="recBtn">🔴 Record footage</button>
      <button class="newp" id="newBtn">＋ New project</button>
    </div>

    <div class="ph">
      <h2>Projects</h2><div class="sp"></div>
      <button class="recent" id="sortBtn">Recent ⌄</button>
    </div>
    <div class="pgrid" id="pgrid"></div>
    <div class="empty" id="pempty">No projects yet.<br/>Tap <b>＋ New project</b> to start.</div>
  </div>
</div>

<!-- ================= EDITOR ================= -->
<div id="editor" class="hidden">
  <div class="tbar">
    <button class="bk" id="bkBtn">‹</button>
    <div class="tt"><b id="eName">Untitled</b><small>Edited just now</small></div>
    <button class="ur" id="undoB">↩</button>
    <button class="ur" id="redoB">↪</button>
    <button class="exp" id="expBtn">Export</button>
  </div>

  <div class="pvwrap">
    <canvas id="pv"></canvas>
    <div class="pills">
      <button class="pill" id="aspBtn">⛶ Original ⌄</button>
    </div>
    <div class="pills" style="top:52px">
      <button class="pill" id="scopesB">∿ Scopes</button>
      <button class="pill" id="cmpB">◫ Compare</button>
    </div>
  </div>

  <div class="tl">
    <div class="tlrow">
      <span class="time" id="tCur">0:00</span><span class="time">/</span><span class="time" id="tDur">0:00</span>
      <div style="flex:1"></div>
      <button class="playb" id="playB">▶</button>
      <div style="flex:1"></div>
      <span class="time" id="tMute">🔈</span>
    </div>
    <div class="ruler" id="ruler"></div>
    <div style="position:relative">
      <div class="strip" id="strip"></div>
      <div class="phead" id="phead" style="left:0"></div>
    </div>
  </div>

  <div class="clipinfo" id="clipInfo" style="display:none">
    <span class="dot">●</span><b id="ciTxt">CLIP 1</b>
    <div class="sp"></div>
    <button class="desel" id="deselB">Deselect</button>
  </div>

  <div class="ctools" id="ctools">
    <button class="ctool" data-t="split"><span class="ic">◫</span>Split</button>
    <button class="ctool" data-t="speed"><span class="ic">◷</span>Speed</button>
    <button class="ctool" data-t="freeze"><span class="ic">❄</span>Freeze</button>
    <button class="ctool" data-t="reverse"><span class="ic">↩</span>Reverse</button>
    <button class="ctool" data-t="transform"><span class="ic">⛶</span>Transform</button>
    <button class="ctool" data-t="delete"><span class="ic">🗑</span>Delete</button>
  </div>

  <div class="sheet2">
    <div class="grip"></div>
    <div class="ptitle">
      <span class="pic" id="pIcon">◍</span><h3 id="pTitle">Looks</h3>
      <div class="seg" id="clipSeg" style="display:none">
        <button data-cs="this">This clip</button><button data-cs="all" class="on">All clips</button>
      </div>
      <button class="rndbtn" id="pReset" title="Reset">↺</button>
      <button class="rndbtn" id="pDone" title="Done">✓</button>
    </div>
    <div class="pbody" id="pbody"></div>
  </div>

  <div class="tabbar" id="tabbar">
    <button class="tab" data-tab="edit"><span class="ic">✂️</span>Edit</button>
    <button class="tab on" data-tab="color"><span class="ic">◍</span>Color</button>
    <button class="tab" data-tab="audio"><span class="ic">🔊</span>Audio</button>
    <button class="tab" data-tab="text"><span class="ic">T</span>Text</button>
    <button class="tab" data-tab="overlay"><span class="ic">▣</span>Overlay</button>
  </div>
</div>

<input type="file" id="fileIn" accept="video/*,image/*" multiple/>
<input type="file" id="imgIn" accept="image/*"/>

<script>
"use strict";
/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b, Math.max(a,v));
const fmtT = s => { s = Math.max(0, s|0); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function showErr(m){ let d=$('errD'); if(!d){ d=el('div'); d.id='errD'; d.style.cssText='position:fixed;top:0;left:0;right:0;background:#ff3b30;color:#fff;padding:10px;font-size:12px;z-index:9999;white-space:pre-wrap;max-height:120px;overflow:auto'; document.body.appendChild(d);} d.textContent='Error: '+m; }
window.onerror = (m,s,l,c) => { showErr(m+' @'+l); return false; };

/* ================= STATE ================= */
const S = {
  project:null, clips:[], selected:-1, playhead:0,
  playing:false, playTimer:null,
  tab:'color', cpanel:'looks', scope:'all',
  cmp:false, muted:false,
  undo:[], redo:[],
};
let videoEl=null, pvCtx=null, gl=null, glProg=null;
let mediaCache={}; // id -> {url, kind, videoEl, thumb}

/* ================= PROJECTS (localStorage) ================= */
const Store = {
  key:'reshi-studio-projects',
  all(){ try{ return JSON.parse(localStorage.getItem(this.key)||'[]'); }catch(e){ return []; } },
  save(list){ try{ localStorage.setItem(this.key, JSON.stringify(list)); }catch(e){} },
  get(id){ return this.all().find(p=>p.id===id); },
  put(proj){
    const list=this.all().filter(p=>p.id!==proj.id);
    list.unshift(proj); this.save(list);
  },
  del(id){ this.save(this.all().filter(p=>p.id!==id)); }
};
function newProject(name){
  const p={ id:'p'+Date.now(), name:name||'My Video', created:Date.now(),
    clips:[], grade:{look:'none',strength:100,film:'none',filmStr:85,
      wheels:{sh:[0,0,0],mi:[0,0,0],hi:[0,0,0]}, exposure:0, contrast:0, sat:0} };
  return p;
}
function pushUndo(){
  if(!S.project) return;
  S.undo.push(JSON.stringify(S.project));
  if(S.undo.length>30) S.undo.shift();
  S.redo.length=0;
}
function doUndo(){
  if(!S.undo.length||!S.project) return;
  S.redo.push(JSON.stringify(S.project));
  S.project=JSON.parse(S.undo.pop());
  S.clips=S.project.clips; S.selected=-1; refreshAll(); saveCur();
}
function doRedo(){
  if(!S.redo.length||!S.project) return;
  S.undo.push(JSON.stringify(S.project));
  S.project=JSON.parse(S.redo.pop());
  S.clips=S.project.clips; S.selected=-1; refreshAll(); saveCur();
}
function saveCur(){ if(S.project){ S.project.clips=S.clips; Store.put(S.project); } }

/* ================= HOME ================= */
function renderHome(){
  const list=Store.all();
  const grid=$('pgrid'); grid.innerHTML='';
  $('pempty').style.display=list.length?'none':'block';
  // continue card
  const cc=$('continueCard');
  if(list.length){
    cc.style.display='flex';
    $('ccName').textContent=list[0].name;
    const n=list[0].clips.length;
    $('ccMeta').textContent=(n? n+' clip'+(n>1?'s':'') : 'No clips')+' · edited just now';
    cc.onclick=()=>openProject(list[0].id);
  } else cc.style.display='none';
  list.forEach(p=>{
    const card=el('button','pcard');
    const th=el('div','th', p.clips.length? '🎬':'📁');
    const dots=el('button','dots','···');
    dots.onclick=e=>{ e.stopPropagation(); if(confirm('Delete "'+p.name+'"?')){ Store.del(p.id); renderHome(); } };
    th.appendChild(dots); card.appendChild(th);
    card.appendChild(el('div','nm',p.name));
    card.appendChild(el('div','mt', p.clips.length+' clip'+(p.clips.length===1?'':'s')));
    card.onclick=()=>openProject(p.id);
    grid.appendChild(card);
  });
}
function openProject(id){
  const p=Store.get(id); if(!p) return;
  S.project=p; S.clips=p.clips||[]; S.selected=-1; S.playhead=0; S.undo=[]; S.redo=[];
  $('home').classList.add('hidden'); $('editor').classList.remove('hidden');
  $('eName').textContent=p.name;
  buildTimeline(); drawPreview(); renderPanel(); updateClipInfo();
}
function goHome(){
  stopPlay(); saveCur();
  $('editor').classList.add('hidden'); $('home').classList.remove('hidden');
  renderHome();
}
/* new project modal */
function openNewModal(){
  const m=el('div','modal');
  m.innerHTML='<div class="box"><h3>New Project</h3>'+
    '<input id="npName" placeholder="My Video" maxlength="40"/>'+
    '<div class="btns"><button class="cancel" id="npC">Cancel</button><button class="go" id="npGo">Create</button></div></div>';
  document.body.appendChild(m);
  const inp=m.querySelector('#npName'); setTimeout(()=>inp.focus(),80);
  const close=()=>m.remove();
  m.querySelector('#npC').onclick=close;
  m.onclick=e=>{ if(e.target===m) close(); };
  const go=()=>{
    const n=inp.value.trim()||'My Video'; close();
    const p=newProject(n); Store.put(p); openProject(p.id);
    setTimeout(()=>$('fileIn').click(),300);
  };
  m.querySelector('#npGo').onclick=go;
  inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
}

/* ================= WEBGL PREVIEW ================= */
const VSRC='attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}';
const FSRC=`
precision mediump float;varying vec2 v;uniform sampler2D t;
uniform float exposure,contrast,sat,warm;
uniform vec3 shC,miC,hiC;uniform float lookAmt;uniform vec3 lookA,lookB;
uniform sampler2D lutT;uniform float lutSize;uniform float useLUT;
vec3 applyLUT(vec3 c){
  float sz=lutSize;
  vec3 s=c*(sz-1.0);
  vec3 i0=floor(s),i1=min(ceil(s),sz-1.0);
  vec3 f=s-i0;
  vec3 c000=tex3(i0),c100=tex3(vec3(i1.x,i0.y,i0.z));
  vec3 c010=tex3(vec3(i0.x,i1.y,i0.z)),c110=tex3(vec3(i1.x,i1.y,i0.z));
  vec3 c001=tex3(vec3(i0.x,i0.y,i1.z)),c101=tex3(vec3(i1.x,i0.y,i1.z));
  vec3 c011=tex3(vec3(i0.x,i1.y,i1.z)),c111=tex3(i1);
  vec3 c00=mix(c000,c100,f.x),c10=mix(c010,c110,f.x);
  vec3 c01=mix(c001,c101,f.x),c11=mix(c011,c111,f.x);
  vec3 c0=mix(c00,c10,f.y),c1=mix(c01,c11,f.y);
  return mix(c0,c1,f.z);
}
vec3 tex3(vec3 idx){
  float sz=lutSize;
  float slice=idx.z*sz+idx.y;
  vec2 uv=vec2((idx.x+0.5)/(sz*sz),(slice+0.5)/sz);
  return texture2D(lutT,uv).rgb;
}
void main(){
 vec3 c=texture2D(t,v).rgb;
 c*=pow(2.,exposure);
 c=(c-.5)*(1.+contrast)+.5;
 float g=dot(c,vec3(.299,.587,.114));
 c=mix(vec3(g),c,1.+sat);
 c=mix(c,c*vec3(1.+warm*.2,1.,1.-warm*.2),abs(warm));
 float lum=g;
 vec3 cc=mix(shC*(1.-smoothstep(0.,.45,lum)),vec3(0.),smoothstep(0.,.15,lum));
 cc+=miC*(1.-abs(lum-.5)*2.);
 cc+=hiC*smoothstep(.55,1.,lum);
 c+=cc*.35;
 vec3 graded;
 if(useLUT>0.5){ graded=applyLUT(c); } else { graded=mix(mix(c,lookA,.5),lookB,.5); }
 c=mix(c,graded,lookAmt);
 gl_FragColor=vec4(clamp(c,0.,1.),1.);
}`;
function initGL(){
  const cv=$('pv');
  gl=cv.getContext('webgl',{preserveDrawingBuffer:false});
  if(!gl){ showErr('WebGL not available'); return false; }
  const sh=(t,s)=>{ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); return o; };
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,VSRC)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FSRC));
  gl.linkProgram(pr); gl.useProgram(pr); glProg=pr;
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,gl.tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.bindTexture(gl.TEXTURE_2D,null);
  return true;
}
function U(n,v){ const l=gl.getUniformLocation(glProg,n); if(l==null)return;
  if(typeof v==='number')gl.uniform1f(l,v); else gl.uniform3f(l,v[0],v[1],v[2]); }
function drawPreview(){
  if(!gl||!S.project) return;
  const cv=$('pv');
  // find clip at playhead
  let t=0, cur=null;
  for(const c of S.clips){ if(S.playhead>=t && S.playhead<t+c.dur){ cur=c; break; } t+=c.dur; }
  const W=cv.clientWidth||300, H=Math.round(W*16/9);
  if(cv.width!==W){ cv.width=W; cv.height=H; }
  gl.viewport(0,0,cv.width,cv.height);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  const g=S.project.grade;
  // uniforms
  gl.useProgram(glProg);
  const setT=gl.getUniformLocation(glProg,'t');
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,gl.tex);
  gl.uniform1i(setT,0);
  U('exposure',g.exposure||0); U('contrast',(g.contrast||0)/100); U('sat',(g.sat||0)/100); U('warm',(g.warm||0)/100);
  const w=g.wheels||{sh:[0,0,0],mi:[0,0,0],hi:[0,0,0]};
  U('shC',w.sh); U('miC',w.mi); U('hiC',w.hi);
  const lk=LOOKS[g.look]||LOOKS.none;
  const isLUT=g.look&&g.look.startsWith('lut:');
  if(isLUT){
    const nm=g.look.slice(4);
    loadLUT(nm); // async, texture binds when ready
    U('lookAmt',(g.strength==null?100:g.strength)/100);
    const ul=gl.getUniformLocation(glProg,'useLUT'); gl.uniform1f(ul,1);
    const sl=gl.getUniformLocation(glProg,'lutSize'); gl.uniform1f(sl,lutSize||32);
    const tl=gl.getUniformLocation(glProg,'lutT');
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,lutTex);
    gl.uniform1i(tl,1);
    gl.activeTexture(gl.TEXTURE0);
  } else {
    U('lookAmt',((g.strength==null?100:g.strength)/100)*(lk.amt==null?1:lk.amt));
    U('lookA',lk.a||[0,0,0]); U('lookB',lk.b||[0,0,0]);
    const ul=gl.getUniformLocation(glProg,'useLUT'); gl.uniform1f(ul,0);
  }
  if(cur && mediaCache[cur.id]){
    const mc=mediaCache[cur.id];
    let src=null;
    if(mc.kind==='video'&&mc.videoEl){ src=mc.videoEl; }
    else if(mc.thumb){ src=mc.thumb; }
    let ready=false;
    if(src){
      if(mc.kind==='video'){ ready=src.readyState>=2 && src.videoWidth>0; }
      else { ready=src.complete && src.naturalWidth>0; }
    }
    if(ready){
      try{
        gl.bindTexture(gl.TEXTURE_2D,gl.tex);
        let texSrc=src;
        // For videos, draw to 2D canvas first (more reliable)
        if(mc.kind==='video'){
          if(!mc._cv){ mc._cv=document.createElement('canvas'); }
          const vw=src.videoWidth, vh=src.videoHeight;
          if(vw&&vh){
            if(mc._cv.width!==vw||mc._cv.height!==vh){ mc._cv.width=vw; mc._cv.height=vh; }
            const c2=mc._cv.getContext('2d');
            c2.drawImage(src,0,0,vw,vh);
            texSrc=mc._cv;
          }
        }
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,texSrc);
        // draw text overlays
        gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
        drawTexts(cur);
        return;
      }catch(e){}
    }
  }
  // empty: draw dark
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ================= MEDIA LOADING ================= */
function handleFiles(files){
  if(!S.project) return;
  pushUndo();
  [...files].forEach(f=>{
    const url=URL.createObjectURL(f);
    const kind=f.type.startsWith('video')?'video':'image';
    const id='m'+Date.now()+Math.random().toString(36).slice(2,7);
    const clip={id, name:f.name, kind, url, dur:kind==='video'?5:3, speed:1, text:[]};
    S.clips.push(clip);
    const mc={id,kind,url};
    if(kind==='video'){
      const v=document.createElement('video');
      v.src=url; v.muted=true; v.playsInline=true; v.preload='auto';
      v.onloadedmetadata=()=>{ clip.dur=v.duration||5; };
      v.oncanplay=()=>{ mc.videoEl=v; 
        // seek to first frame to ensure data
        try{ v.currentTime=0.1; }catch(e){}
        buildTimeline(); updateDur(); drawPreview();
      };
      mc.videoEl=v;
    } else {
      const im=new Image();
      im.onload=()=>{ mc.thumb=im; buildTimeline(); };
      im.src=url;
    }
    mediaCache[id]=mc;
  });
  buildTimeline(); updateDur(); saveCur();
}
function totalDur(){ return S.clips.reduce((a,c)=>a+c.dur/(c.speed||1),0); }
function updateDur(){ $('tDur').textContent=fmtT(totalDur()); buildRuler(); }

/* ================= PLAYBACK ================= */
function clipAt(t){
  let acc=0;
  for(let i=0;i<S.clips.length;i++){ const d=S.clips[i].dur/(S.clips[i].speed||1);
    if(t>=acc&&t<acc+d) return {clip:S.clips[i],idx:i,start:acc,local:t-acc};
    acc+=d; }
  return null;
}
function togglePlay(){
  if(S.playing){ stopPlay(); return; }
  if(!S.clips.length){ showErr('Import a video first (+ below timeline)'); return; }
  S.playing=true; $('playB').textContent='⏸';
  let last=performance.now();
  const step=now=>{
    if(!S.playing) return;
    const dt=(now-last)/1000; last=now;
    S.playhead+=dt;
    if(S.playhead>=totalDur()){ S.playhead=0; }
    // sync video elements
    const hit=clipAt(S.playhead);
    S.clips.forEach((c,i)=>{
      const mc=mediaCache[c.id];
      if(mc&&mc.videoEl){
        const isCur=hit&&hit.idx===i;
        if(isCur){
          const want=hit.local*(c.speed||1);
          if(Math.abs(mc.videoEl.currentTime-want)>.3) mc.videoEl.currentTime=want;
          if(mc.videoEl.paused) mc.videoEl.play().catch(()=>{});
        } else if(!mc.videoEl.paused) mc.videoEl.pause();
      }
    });
    updatePlayhead(); drawPreview();
    S.playTimer=requestAnimationFrame(step);
  };
  S.playTimer=requestAnimationFrame(step);
}
function stopPlay(){
  S.playing=false; $('playB').textContent='▶';
  if(S.playTimer) cancelAnimationFrame(S.playTimer); S.playTimer=null;
  Object.values(mediaCache).forEach(mc=>{ if(mc.videoEl&&!mc.videoEl.paused) mc.videoEl.pause(); });
}
function updatePlayhead(){
  $('tCur').textContent=fmtT(S.playhead);
  const strip=$('strip'), w=strip.clientWidth||300;
  const d=totalDur()||1;
  $('phead').style.left=(S.playhead/d*w)+'px';
}

/* ================= TIMELINE ================= */
function buildRuler(){
  const r=$('ruler'); r.innerHTML='';
  const d=totalDur()||1, w=r.clientWidth||300;
  const step=d>60?10:d>20?5:1;
  for(let t=0;t<=d;t+=step){
    const s=el('span',null,fmtT(t)); s.style.left=(t/d*w)+'px'; r.appendChild(s);
  }
}
function buildTimeline(){
  const strip=$('strip'); strip.innerHTML='';
  const d=totalDur()||1;
  S.clips.forEach((c,i)=>{
    const cd=c.dur/(c.speed||1);
    const dv=el('div','clip'+(i===S.selected?' sel':''));
    dv.style.flex=cd.toFixed(2);
    const mc=mediaCache[c.id];
    if(mc&&mc.thumb){ const im=document.createElement('img'); im.src=c.url; dv.appendChild(im); }
    else if(c.kind==='video'){ dv.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem">🎬</div>'; }
    else dv.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem">🖼</div>';
    if((c.speed||1)!==1){ const b=el('div',null,(c.speed)+'×'); b.style.cssText='position:absolute;top:4px;left:4px;background:rgba(0,0,0,.5);color:#fff;font-size:.65rem;border-radius:6px;padding:2px 6px'; dv.appendChild(b); }
    dv.onclick=()=>{ S.selected=i; buildTimeline(); updateClipInfo(); };
    strip.appendChild(dv);
  });
  const add=el('button','addbtn','＋');
  add.onclick=()=>$('fileIn').click();
  strip.appendChild(add);
  updatePlayhead(); updateClipInfo(); drawPreview();
}
function updateClipInfo(){
  const ci=$('clipInfo');
  if(S.selected>=0&&S.clips[S.selected]){
    ci.style.display='flex';
    const c=S.clips[S.selected];
    $('ciTxt').textContent='CLIP '+(S.selected+1)+' · '+(c.dur/(c.speed||1)).toFixed(1)+' S';
  } else ci.style.display='none';
}
// scrub by tapping timeline
function initScrub(){
  const strip=$('strip');
  let drag=false;
  const set=x=>{
    const r=strip.getBoundingClientRect();
    const p=clamp((x-r.left)/r.width,0,1);
    S.playhead=p*(totalDur()||0);
    // sync videos
    const hit=clipAt(S.playhead);
    S.clips.forEach((c,i)=>{ const mc=mediaCache[c.id];
      if(mc&&mc.videoEl&&hit&&hit.idx===i){ mc.videoEl.currentTime=hit.local*(c.speed||1); }});
    updatePlayhead(); drawPreview();
  };
  strip.addEventListener('pointerdown',e=>{ drag=true; set(e.clientX); });
  window.addEventListener('pointermove',e=>{ if(drag) set(e.clientX); });
  window.addEventListener('pointerup',()=>drag=false);
}

};
const LUT_LIST=[
 'well-see.CUBE','Cine_wedding.cube','Cinematic_Lut_V2.cube','Cinematic_Lut_V2_2.cube',
 'FGCineVibrant.cube','Going_for_a_walk.CUBE','Once_upon_a_time.CUBE','SONY_HL.cube',
 'Sony-CL-AZ.cube','Apple-Log_XZ1.cube','DJI_OSMO_Action_4_D-Log_M_to_Rec.709_V1_2.cube',
 'Golden_Forest_35.A035_04040921_C008__1.cube','lut_1.rabbit-5639615.cube',
 'sony_lut_1.Animals_09___4K_res.cube'
];
let lutTex=null, lutSize=0, lutName='';
function parseCube(txt){
  const lines=txt.split(/\r?\n/);
  let size=0; const data=[];
  for(const ln of lines){
    const l=ln.trim();
    if(!l||l[0]==='#')continue;
    if(l.startsWith('LUT_3D_SIZE')){ size=parseInt(l.split(/\s+/)[1]); continue; }
    if(l.startsWith('TITLE')||l.startsWith('DOMAIN'))continue;
    const p=l.split(/\s+/).map(Number);
    if(p.length>=3&&p.every(v=>!isNaN(v)))data.push(p[0],p[1],p[2]);
  }
  return {size,data:new Float32Array(data)};
}
async function loadLUT(name){
  if(lutName===name&&lutTex)return true;
  try{
    const r=await fetch('luts/'+name);
    if(!r.ok)return false;
    const txt=await r.text();
    const {size,data}=parseCube(txt);
    if(!size||!data.length)return false;
    // create 2D texture: width=size*size, height=size
    if(!gl)return false;
    if(lutTex)gl.deleteTexture(lutTex);
    lutTex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,lutTex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    const px=new Uint8Array(data.length);
    for(let i=0;i<data.length;i++)px[i]=Math.round(Math.min(1,Math.max(0,data[i]))*255);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB, size*size, size, 0, gl.RGB, gl.UNSIGNED_BYTE, px);
    lutSize=size; lutName=name;
    return true;
  }catch(e){ return false; }
}

    const sel=document.createElement('select');
    sel.style.cssText='margin-left:auto;border:none;background:none;font-size:.88rem';
    Object.keys(FILMS).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=FILMS[k].n; if(g.film===k)o.selected=true; sel.appendChild(o); });
    sel.onchange=()=>{ pushUndo(); g.film=sel.value; applyFilm(); drawPreview(); saveCur(); };
    row.appendChild(sel); b.appendChild(row);
    b.appendChild(sliderRow('Strength',g.filmStr==null?85:g.filmStr,0,100,v=>{ g.filmStr=v; applyFilm(); drawPreview(); saveCur(); },v=>v));
    b.appendChild(el('p','help','Film stocks emulate real cinema negative. Strength controls intensity.'));
  }
  else if(S.cpanel==='grade'){
    const tabs=el('div','chips');
    ['3-Way','Shadows','Mids','Highlights','Global'].forEach((t,i)=>{
      const c=el('button','chip'+(i===0?' on':''),t); tabs.appendChild(c);
    });
    b.appendChild(tabs);
    const wr=el('div','wheels');
    [['Shadows','sh'],['Midtones','mi'],['Highlights','hi']].forEach(([lab,key])=>{
      const w=el('div','wheel');
      const cv=document.createElement('canvas'); cv.width=192; cv.height=192;
      w.appendChild(cv);
      w.appendChild(el('div','wl',lab));
      w.appendChild(el('div','ll','Lum 0'));
      drawWheel(cv,g.wheels[key]);
      wheelDrag(cv,v=>{ pushUndo(); g.wheels[key]=v; drawWheel(cv,v); drawPreview(); saveCur(); });
      wr.appendChild(w);
    });
    b.appendChild(wr);
    b.appendChild(sliderRow('Exposure',g.exposure||0,-100,100,v=>{ g.exposure=v/50; drawPreview(); saveCur(); },v=>(v/50).toFixed(1)));
    b.appendChild(sliderRow('Contrast',g.contrast||0,-100,100,v=>{ g.contrast=v; drawPreview(); saveCur(); }));
    b.appendChild(sliderRow('Saturation',g.sat||0,-100,100,v=>{ g.sat=v; drawPreview(); saveCur(); }));
    b.appendChild(sliderRow('Warmth',g.warm||0,-100,100,v=>{ g.warm=v; drawPreview(); saveCur(); }));
  }
  else if(S.cpanel==='edit'){
    b.appendChild(el('p','help','Select a clip in the timeline, then use the tools above (Split · Speed · Freeze · Reverse · Transform · Delete).<br><br>Tap ＋ in the timeline to import video.'));
  }
  else if(S.cpanel==='audio'){
    const c=S.selected>=0?S.clips[S.selected]:null;
    if(!c){ b.appendChild(el('p','help','Select a clip to adjust its audio.')); }
    else{
      if(c.vol==null)c.vol=100;
      b.appendChild(sliderRow('Volume',c.vol,0,200,v=>{ pushUndo(); c.vol=v; applyVol(c); saveCur(); },v=>v+'%'));
      b.appendChild(el('p','help','Volume applies on export. Preview is muted for performance.'));
    }
  }
  else if(S.cpanel==='text'){
    const c=S.selected>=0?S.clips[S.selected]:null;
    if(!c){ b.appendChild(el('p','help','Select a clip, then add text overlays.')); }
    else{
      const add=el('button','bigbtn','＋ Add Text'); add.style.marginTop='6px';
      add.onclick=()=>{ pushUndo(); c.text=c.text||[]; c.text.push({txt:'Title',size:42}); drawPreview(); renderPanel(); saveCur(); };
      b.appendChild(add);
      (c.text||[]).forEach((t,i)=>{
        const row=el('div','row2');
        const inp=document.createElement('input');
        inp.value=t.txt; inp.style.cssText='flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.9rem';
        inp.onchange=()=>{ pushUndo(); t.txt=inp.value; drawPreview(); saveCur(); };
        const del=el('button','rndbtn','✕'); del.onclick=()=>{ pushUndo(); c.text.splice(i,1); renderPanel(); drawPreview(); saveCur(); };
        row.appendChild(inp); row.appendChild(del); b.appendChild(row);
      });
      b.appendChild(el('p','help','Text renders on preview and export.'));
    }
  }
  else { b.appendChild(el('p','help','Coming soon.')); }
}
function applyFilm(){
  const g=S.project.grade, f=FILMS[g.film]||FILMS.none;
  if(!f.a){ g.look=g.look; return; }
  // blend film into look by storing as look override
  g._filmA=f.a; g._filmB=f.b; g._filmAmt=(f.amt||.8)*((g.filmStr==null?85:g.filmStr)/100);
}
function applyVol(c){ const mc=mediaCache[c.id]; if(mc&&mc.videoEl) mc.videoEl.volume=(c.vol==null?1:c.vol/100); }
/* color wheels */
function drawWheel(cv,rgb){
  const x=cv.getContext('2d'),R=96;
  x.clearRect(0,0,192,192);
  for(let a=0;a<360;a+=3){
    const gr=x.createRadialGradient(R,R,10,R,R,R);
    const h=a;
    gr.addColorStop(0,'#808080');
    gr.addColorStop(1,'hsl('+h+',90%,55%)');
    x.fillStyle=gr; x.beginPath(); x.moveTo(R,R);
    x.arc(R,R,R,a*Math.PI/180,(a+3)*Math.PI/180); x.closePath(); x.fill();
  }
  x.fillStyle='rgba(0,0,0,.35)'; x.beginPath(); x.arc(R,R,26,0,7); x.fill();
  const px=R+rgb[0]*R*.8, py=R+rgb[1]*R*.8;
  x.strokeStyle='#fff'; x.lineWidth=4; x.beginPath(); x.arc(px,py,12,0,7); x.stroke();
  x.strokeStyle='#000'; x.lineWidth=1.5; x.beginPath(); x.arc(px,py,12,0,7); x.stroke();
}
function wheelDrag(cv,fn){
  let on=false;
  const pos=e=>{
    const r=cv.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX), cy=(e.touches?e.touches[0].clientY:e.clientY);
    let dx=(cx-r.left-r.width/2)/(r.width/2), dy=(cy-r.top-r.height/2)/(r.height/2);
    const m=Math.hypot(dx,dy); if(m>1){dx/=m;dy/=m;}
    fn([+dx.toFixed(2),+dy.toFixed(2),0]);
  };
  cv.addEventListener('pointerdown',e=>{on=true;cv.setPointerCapture(e.pointerId);pos(e);});
  cv.addEventListener('pointermove',e=>{if(on)pos(e);});
  cv.addEventListener('pointerup',()=>on=false);
}

/* ================= EDIT TOOLS ================= */
function selClip(){ return S.selected>=0?S.clips[S.selected]:null; }
function doSplit(){
  const c=selClip(); if(!c){ showErr('Select a clip first'); return; }
  const hit=clipAt(S.playhead); if(!hit||hit.idx!==S.selected){ showErr('Move playhead over the selected clip'); return; }
  pushUndo();
  const at=hit.local;
  const c2=JSON.parse(JSON.stringify(c));
  c2.id='m'+Date.now()+Math.random().toString(36).slice(2,7);
  c.dur=at; c2.dur=c.dur<0?0:(clipDurRaw(c)-at);
  function clipDurRaw(x){ return x.dur; }
  c2.dur=Math.max(.1,(c2._rd||c.dur)-0); // fallback
  // recompute properly:
  const origDur=c.dur+ (c2.dur); // c.dur already set to at
  c2.dur=Math.max(.1, origDur-at);
  // copy media
  mediaCache[c2.id]=mediaCache[c.id];
  S.clips.splice(S.selected+1,0,c2);
  buildTimeline(); saveCur();
}
function doSpeed(){
  const c=selClip(); if(!c){ showErr('Select a clip first'); return; }
  const m=el('div','sheetm');
  m.innerHTML='<div class="box"><h3>Speed</h3><div class="chips" id="spCh"></div></div>';
  document.body.appendChild(m);
  const ch=m.querySelector('#spCh');
  [.25,.5,1,1.5,2,4].forEach(s=>{
    const b=el('button','chip'+((c.speed||1)===s?' on':''),s+'×');
    b.onclick=()=>{ pushUndo(); c.speed=s; m.remove(); buildTimeline(); updateDur(); saveCur(); };
    ch.appendChild(b);
  });
  m.onclick=e=>{ if(e.target===m)m.remove(); };
}
function doFreeze(){
  const c=selClip(); if(!c){ showErr('Select a clip first'); return; }
  pushUndo(); c.speed=.1; buildTimeline(); updateDur(); saveCur();
}
function doReverse(){
  const c=selClip(); if(!c){ showErr('Select a clip first'); return; }
  c.rev=!c.rev; pushUndo(); buildTimeline(); saveCur();
  showErr(c.rev?'Reversed (applies on export)':'Reverse off');
  // clear err after 1.5s
  setTimeout(()=>{ const d=$('errD'); if(d)d.remove(); },1500);
}
function doTransform(){
  const c=selClip(); if(!c){ showErr('Select a clip first'); return; }
  const m=el('div','sheetm');
  m.innerHTML='<div class="box"><h3>Transform</h3><div id="tfB"></div>'+
    '<button class="bigbtn ghost" id="tfX" style="margin-top:10px">Done</button></div>';
  document.body.appendChild(m);
  const bx=m.querySelector('#tfB');
  if(c.rot==null)c.rot=0; if(c.flip==null)c.flip=false;
  const rots=[0,90,180,270];
  const rc=el('div','chips');
  rots.forEach(r=>{
    const b=el('button','chip'+(c.rot===r?' on':''),r+'°');
    b.onclick=()=>{ pushUndo(); c.rot=r; rc.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); drawPreview(); saveCur(); };
    rc.appendChild(b);
  });
  bx.appendChild(el('div','srow',null)).appendChild(el('span','lab','Rotate'));
  bx.appendChild(rc);
  const fb=el('button','bigbtn ghost','⇋ Flip horizontal');
  fb.onclick=()=>{ pushUndo(); c.flip=!c.flip; drawPreview(); saveCur(); };
  bx.appendChild(fb);
  m.querySelector('#tfX').onclick=()=>m.remove();
  m.onclick=e=>{ if(e.target===m)m.remove(); };
}
function doDelete(){
  const c=selClip(); if(!c){ showErr('Select a clip first'); return; }
  if(!confirm('Delete this clip?')) return;
  pushUndo();
  S.clips.splice(S.selected,1); S.selected=-1;
  buildTimeline(); updateDur(); saveCur();
}

/* ================= EXPORT ================= */
function openExport(){
  if(!S.clips.length){ showErr('Import a video first'); return; }
  const m=el('div','sheetm');
  m.innerHTML='<div class="box"><h3>Export</h3>'+
    '<div class="row2"><span class="lab">Resolution</span><span class="val">Original</span></div>'+
    '<div class="row2"><span class="lab">Format</span><span class="val">MP4</span></div>'+
    '<div class="prog"><i id="exP"></i></div><p class="help" id="exM">Ready</p>'+
    '<button class="bigbtn" id="exGo">Export Video</button>'+
    '<button class="bigbtn ghost" id="exX">Cancel</button></div>';
  document.body.appendChild(m);
  m.querySelector('#exX').onclick=()=>m.remove();
  m.onclick=e=>{ if(e.target===m)m.remove(); };
  m.querySelector('#exGo').onclick=()=>runExport(m);
}
async function runExport(m){
  const bar=m.querySelector('#exP'), msg=m.querySelector('#exM'), go=m.querySelector('#exGo');
  go.disabled=true; go.textContent='Rendering…';
  try{
    const w=720,h=1280;
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const cx=cv.getContext('2d');
    const stream=cv.captureStream(30);
    // audio
    let audioCtx=null, dest=null;
    try{
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      dest=audioCtx.createMediaStreamDestination();
      stream.addTrack(dest.stream.getAudioTracks()[0]);
    }catch(e){}
    const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:8e6});
    const chunks=[]; rec.ondataavailable=e=>{ if(e.data.size)chunks.push(e.data); };
    const done=new Promise(r=>rec.onstop=r);
    rec.start(200);
    const total=totalDur();
    const fps=30, dt=1/fps;
    // render each frame with 2d (simplified grade)
    for(let t=0;t<total;t+=dt){
      const hit=clipAt(t);
      msg.textContent='Rendering '+Math.round(t/total*100)+'%';
      bar.style.width=(t/total*100)+'%';
      cx.fillStyle='#000'; cx.fillRect(0,0,w,h);
      if(hit){
        const mc=mediaCache[hit.clip.id];
        let src=mc&&mc.videoEl?mc.videoEl:(mc&&mc.thumb?mc.thumb:null);
        if(src){
          if(mc.videoEl){ try{ mc.videoEl.currentTime=hit.local*(hit.clip.speed||1); await new Promise(r=>setTimeout(r,30)); }catch(e){} }
          // draw cover
          const sw=src.videoWidth||src.width, sh=src.videoHeight||src.height;
          if(sw&&sh){
            const s=Math.max(w/sw,h/sh), dw=sw*s, dh=sh*s;
            cx.save();
            cx.translate(w/2,h/2); cx.rotate((hit.clip.rot||0)*Math.PI/180);
            if(hit.clip.flip)cx.scale(-1,1);
            cx.drawImage(src,-dw/2,-dh/2,dw,dh);
            cx.restore();
            // grade tint (simple)
            const g=S.project.grade, lk=LOOKS[g.look]||LOOKS.none;
            if(lk.a&&((g.strength||100)>0)){
              cx.fillStyle='rgba('+(lk.b[0]*255|0)+','+(lk.b[1]*255|0)+','+(lk.b[2]*255|0)+','+(((g.strength||100)/100)*.25)+')';
              cx.fillRect(0,0,w,h);
            }
            // text
            (hit.clip.text||[]).forEach(tx=>{
              cx.fillStyle='#fff'; cx.font='bold '+(tx.size||42)+'px sans-serif';
              cx.textAlign='center'; cx.textBaseline='middle';
              cx.fillText(tx.txt,w/2,h/2);
            });
          }
        }
      }
      await new Promise(r=>setTimeout(r,0));
    }
    rec.stop(); await done;
    const blob=new Blob(chunks,{type:'video/webm'});
    const u=URL.createObjectURL(blob);
    msg.innerHTML='';
    const a=document.createElement('a');
    a.href=u; a.download='reshi-'+Date.now()+'.webm'; a.className='bigbtn';
    a.style.cssText='display:block;text-align:center;text-decoration:none'; a.textContent='⬇ Download ('+(blob.size/1048576).toFixed(1)+' MB)';
    msg.appendChild(a);
    go.style.display='none';
  }catch(e){ msg.textContent='Export failed: '+e.message; go.disabled=false; go.textContent='Retry'; }
}

/* ================= WIRE UP ================= */
function wire(){
  $('newBtn').onclick=openNewModal;
  $('recBtn').onclick=()=>{ const p=newProject('Recorded '+new Date().toLocaleTimeString()); Store.put(p); openProject(p.id); setTimeout(()=>$('fileIn').click(),300); };
  $('sortBtn').onclick=()=>renderHome();
  $('continueCard').onclick=()=>{ const l=Store.all(); if(l.length)openProject(l[0].id); };
  $('bkBtn').onclick=goHome;
  $('undoB').onclick=doUndo; $('redoB').onclick=doRedo;
  $('playB').onclick=togglePlay;
  $('tMute').onclick=()=>{ S.muted=!S.muted; $('tMute').textContent=S.muted?'🔊':'🔈'; };
  $('deselB').onclick=()=>{ S.selected=-1; buildTimeline(); };
  $('fileIn').onchange=e=>{ handleFiles(e.target.files); e.target.value=''; };
  $('expBtn').onclick=openExport;
  $('aspBtn').onclick=()=>{ showErr('Aspect: Original'); setTimeout(()=>{const d=$('errD');if(d)d.remove();},1200); };
  $('scopesB').onclick=()=>{ showErr('Scopes coming soon'); setTimeout(()=>{const d=$('errD');if(d)d.remove();},1200); };
  $('cmpB').onclick=()=>{ S.cmp=!S.cmp; $('cmpB').style.background=S.cmp?'var(--acc)':'rgba(0,0,0,.55)'; drawPreview(); };
  document.querySelectorAll('#tabbar .tab').forEach(b=>{
    b.onclick=()=>{
      const t=b.dataset.tab;
      if(t==='color'){ setPanel('looks'); }
      else if(t==='edit'){ setPanel('edit'); }
      else setPanel(t);
    };
  });
  document.querySelectorAll('#ctools .ctool').forEach(b=>{
    b.onclick=()=>{
      const t=b.dataset.t;
      if(t==='split')doSplit(); else if(t==='speed')doSpeed();
      else if(t==='freeze')doFreeze(); else if(t==='reverse')doReverse();
      else if(t==='transform')doTransform(); else if(t==='delete')doDelete();
    };
  });
  document.querySelectorAll('#clipSeg button').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('#clipSeg button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); S.scope=b.dataset.cs;
    };
  });
  $('pReset').onclick=()=>{
    if(!S.project)return; pushUndo();
    S.project.grade={look:'none',strength:100,film:'none',filmStr:85,wheels:{sh:[0,0,0],mi:[0,0,0],hi:[0,0,0]},exposure:0,contrast:0,sat:0};
    drawPreview(); renderPanel(); saveCur();
  };
  $('pDone').onclick=()=>{ /* collapse */ };
  // color sub-tabs: looks/film/grade switcher via pTitle click cycle
  $('pTitle').onclick=()=>{
    const order=['looks','film','grade'];
    const i=order.indexOf(S.cpanel);
    setPanel(order[(i+1)%order.length]);
  };
  initScrub();
  window.addEventListener('resize',()=>{ buildRuler(); drawPreview(); });
}
/* ================= INIT ================= */
(function init(){
  try{
    if(!initGL()){ /* canvas fallback still works via 2d */ }
    wire();
    renderHome();
    // redraw loop for preview
    (function loop(){
      if(S.project&&!$('editor').classList.contains('hidden')) drawPreview();
      requestAnimationFrame(loop);
    })();
  }catch(e){ showErr('Init: '+e.message); }
})();
</script>
