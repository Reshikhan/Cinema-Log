<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Reshi Studio — Video Editor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#ffffff;--bg2:#f2f2f7;--card:#ffffff;--line:#e5e5ea;--txt:#000;--mut:#8e8e93;--acc:#ff9f43;--blue:#007aff;--shadow:0 2px 12px rgba(0,0,0,.08)}
body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.hidden{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
/* HOME */
.hd{display:flex;align-items:center;padding:18px 0 4px}
.hd h1{margin:0;font-size:1.5rem;font-weight:800}
.hd .sp{flex:1}
.gopro{background:var(--acc);color:#fff;border:none;border-radius:20px;padding:8px 16px;font-weight:700;font-size:.85rem}
.sub{color:var(--mut);font-size:.8rem;margin:4px 0 16px}
.ccard{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#2c2c34,#101014);min-height:170px;display:flex;align-items:flex-end;box-shadow:var(--shadow)}
.ccard .tx{padding:16px;color:#fff}
.ccard .k{font-size:.65rem;letter-spacing:2px;color:#ffd9a8;font-weight:700}
.ccard h2{margin:4px 0;font-size:1.4rem}
.ccard p{margin:0;color:#c7c7cc;font-size:.8rem}
.cplay{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--acc);border:none;color:#fff;font-size:1.4rem}
.hbtns{display:flex;gap:10px;margin:14px 0 20px}
.hbtns button{flex:1;border:none;border-radius:24px;padding:14px;font-size:.95rem;font-weight:700}
.rec{background:var(--acc);color:#fff}
.newp{background:var(--bg2);color:var(--txt)}
.ph{display:flex;align-items:center;margin-bottom:10px}
.ph h2{margin:0;font-size:1.2rem}
.ph .sp{flex:1}.ph span{color:var(--mut);font-size:.85rem}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--bg2);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.pcard .th{position:relative;aspect-ratio:3/4;background:linear-gradient(135deg,#d1d1d6,#a8a8b0);display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff}
.pcard .th .dots{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:28px;height:28px}
.pcard .nm{padding:8px 10px 2px;font-weight:700;font-size:.85rem}
.pcard .mt{padding:0 10px 10px;color:var(--mut);font-size:.75rem}
.empty{text-align:center;color:var(--mut);padding:40px 0}
/* EDITOR */
#editor{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:20px}
.tbar{display:flex;align-items:center;gap:8px;padding:12px 12px}
.bk{width:38px;height:38px;border-radius:50%;background:var(--bg2);border:none;font-size:1.1rem}
.tt{flex:1;min-width:0}.tt b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{color:var(--mut);font-size:.72rem}
.ur{background:var(--bg2);border:none;border-radius:18px;padding:8px 14px;color:var(--mut);font-size:1rem}
.exp{background:var(--acc);color:#fff;border:none;border-radius:20px;padding:10px 20px;font-weight:700}
.pw{position:relative;background:#000;display:flex;justify-content:center}
#preview{max-width:100%;max-height:52vh;display:block}
.asp{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:16px;padding:7px 12px;font-size:.78rem}
.pvp{position:absolute;top:52px;left:10px;display:flex;gap:8px}
.pvp button{background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:16px;padding:7px 12px;font-size:.78rem}
/* timeline */
.tl{padding:10px 12px 0}
.tlh{display:flex;align-items:center;gap:10px}
.tlh .tm{font-size:.85rem;font-weight:700}.tlh .tm span{color:var(--mut);font-weight:400}
.pbtn{width:44px;height:44px;border-radius:50%;background:var(--bg2);border:none;font-size:1.1rem}
.tlh .sp{flex:1}.icobtn{background:none;border:none;font-size:1.1rem;color:var(--mut)}
.ruler{position:relative;height:26px;margin-top:6px;color:var(--mut);font-size:.65rem}
.ruler span{position:absolute;transform:translateX(-50%)}
.ruler span::after{content:'';position:absolute;left:50%;top:14px;width:1px;height:6px;background:#c7c7cc}
#strip{position:relative;display:flex;gap:2px;overflow:hidden;border-radius:10px;background:var(--bg2);min-height:64px}
#strip img{height:64px;object-fit:cover;flex:1;min-width:0}
#strip .addm{width:52px;flex:none;background:var(--bg2);border:1px dashed #c7c7cc;border-radius:10px;font-size:1.4rem;color:var(--mut)}
.phead{position:absolute;top:-6px;bottom:-6px;width:2px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.5);pointer-events:none}
.phead::before{content:'';position:absolute;top:-4px;left:-5px;border:6px solid transparent;border-top:8px solid #fff}
/* clip info + edit tools */
.cinfo{display:flex;align-items:center;padding:10px 14px 4px;font-size:.78rem}
.cinfo .o{color:var(--acc);font-weight:700;letter-spacing:1px}
.cinfo .sp{flex:1}.cinfo .ds{color:var(--mut);background:none;border:none;font-size:.78rem}
.etools{display:flex;justify-content:space-around;padding:8px 4px}
.etools button{background:none;border:none;color:var(--mut);font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:3px}
.etools button b{font-size:1.25rem;font-weight:400}
/* tab bar */
.tabb{display:flex;background:var(--bg2);border-radius:24px;margin:6px 12px;padding:4px}
.tabb button{flex:1;background:none;border:none;border-radius:20px;padding:9px 0;font-size:.78rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabb button b{font-size:1.05rem;font-weight:400}
.tabb button.on{background:#fff;color:var(--acc);box-shadow:var(--shadow);font-weight:700}
/* color panel */
#cpanel{background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.1);padding:8px 16px 30px;margin-top:8px;max-height:62vh;overflow-y:auto}
.grip{width:40px;height:4px;border-radius:2px;background:#d1d1d6;margin:4px auto 10px}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.prow h3{margin:0;font-size:1.05rem;flex:1}
.seg{display:flex;background:var(--bg2);border-radius:16px;padding:2px}
.seg button{border:none;background:none;border-radius:14px;padding:6px 12px;font-size:.75rem;color:var(--mut)}
.seg button.on{background:var(--blue);color:#fff;font-weight:700}
.rbtn{width:34px;height:34px;border-radius:50%;background:var(--bg2);border:none;font-size:.9rem}
.okbtn{width:34px;height:34px;border-radius:50%;background:var(--bg2);border:none;font-size:.9rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:8px 14px;font-size:.8rem;color:var(--txt)}
.chip.on{background:var(--txt);color:#fff;border-color:var(--txt)}
.sub2{display:flex;background:var(--bg2);border-radius:16px;padding:3px;margin-bottom:10px;overflow-x:auto}
.sub2 button{flex:1;border:none;background:none;padding:7px 4px;font-size:.75rem;color:var(--mut);white-space:nowrap}
.sub2 button.on{background:#fff;border-radius:13px;color:var(--txt);font-weight:700;box-shadow:var(--shadow)}
.lrow{display:flex;gap:10px;overflow-x:auto;padding:6px 0}
.look{flex:0 0 auto;width:92px;text-align:center}
.look cv,.look canvas{width:92px;height:110px;border-radius:12px;object-fit:cover;background:var(--bg2)}
.look.sel canvas{outline:2px solid var(--acc)}
.look .hk{position:relative}
.look .hb{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.55);color:#fff;font-size:.6rem;border-radius:6px;padding:2px 6px}
.look .ck{position:absolute;bottom:4px;right:4px;background:var(--acc);color:#fff;border-radius:50%;width:20px;height:20px;font-size:.7rem;display:flex;align-items:center;justify-content:center}
.look span{font-size:.68rem;color:var(--mut);display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.look.sel span{color:var(--acc);font-weight:700}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0}
.srow label{width:110px;font-size:.85rem;flex:none}
.srow input[type=range]{flex:1;accent-color:var(--acc)}
.srow .v{width:44px;text-align:right;font-size:.85rem;color:var(--mut)}
.prow2{background:var(--bg2);border-radius:14px;padding:12px;margin:8px 0;display:flex;align-items:center}
.prow2 .l{color:var(--mut);font-size:.85rem;width:70px}
.prow2 .r{flex:1;text-align:right;font-weight:700}
.wheels3{display:flex;justify-content:space-around;margin:6px 0}
.wb{text-align:center;font-size:.75rem;color:var(--mut)}
.wb canvas{display:block;margin:0 auto 4px;touch-action:none}
.wb input{width:110px;accent-color:var(--acc)}
.wb .lv{font-size:.7rem;color:var(--mut)}
.help{color:var(--mut);font-size:.75rem;line-height:1.5;margin-top:10px}
#warper{width:280px;height:280px;display:block;margin:6px auto;touch-action:none}
.stepper{display:flex;align-items:center;background:var(--bg2);border-radius:16px;padding:4px}
.stepper button{width:34px;height:34px;border-radius:50%;border:none;background:#fff;font-size:1.1rem;box-shadow:var(--shadow)}
.stepper span{padding:0 14px;font-size:.85rem}
/* export sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .bx{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:520px;padding:20px;max-height:80vh;overflow-y:auto}
.sheet h3{margin:0 0 12px}
.orow{display:flex;align-items:center;margin:10px 0}
.orow label{width:100px;color:var(--mut);font-size:.85rem}
.orow select{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.9rem;background:#fff}
.bigbtn{width:100%;border:none;border-radius:20px;padding:15px;font-size:1rem;font-weight:700;background:var(--acc);color:#fff;margin-top:8px}
.ghostb{width:100%;border:none;background:none;color:var(--mut);padding:12px;margin-top:4px}
#expBarW{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;margin:10px 0}
#expBar{height:100%;width:0;background:var(--acc)}
</style>
</head>
<body>
<!-- HOME -->
<div id="home" class="wrap">
  <div class="hd"><h1>✂️ Reshi Studio</h1><div class="sp"></div></div>
  <p class="sub">21 looks · record 4K 60 HDR · smooth slow motion</p>
  <div id="contCard" class="hidden"><div class="ccard" id="contBg"><div class="tx"><div class="k">CONTINUE EDITING</div><h2 id="contName"></h2><p id="contMeta"></p></div><button class="cplay" id="contPlay">▶</button></div></div>
  <div class="hbtns"><button class="rec" id="recBtn">🔴 Record footage</button><button class="newp" id="newBtn">＋ New project</button></div>
  <div class="ph"><h2>Projects</h2><div class="sp"></div><span>Recent ⌄</span></div>
  <div id="pgrid" class="pgrid"></div>
  <div id="pempty" class="empty hidden">No projects yet.<br>Tap <b>＋ New project</b> to start.</div>
</div>
<!-- EDITOR -->
<div id="editor" class="hidden">
  <div class="tbar"><button class="bk" id="bkBtn">‹</button><div class="tt"><b id="eName">Untitled</b><small>Edited just now</small></div><button class="ur" id="undoB">↩</button><button class="ur" id="redoB">↪</button><button class="exp" id="expBtn">Export</button></div>
  <div class="pw"><canvas id="preview"></canvas><button class="asp" id="aspBtn">⛶ Original ⌄</button><div class="pvp"><button id="scopesB">∿ Scopes</button><button id="cmpB">◐ Compare</button></div></div>
  <div class="tl"><div class="tlh"><span class="tm"><b id="tCur">0:00</b> <span>/ <span id="tTot">0:00</span></span></span><button class="pbtn" id="playB">▶</button><div class="sp"></div><button class="icobtn" id="muteB">🔊</button><button class="icobtn">⛶</button></div>
    <div class="ruler" id="ruler"></div>
    <div style="position:relative"><div id="strip"></div><div class="phead" id="phead"></div></div></div>
  <div class="cinfo"><span class="o" id="clipLbl">● CLIP 1 · 0.0 S</span><div class="sp"></div><button class="ds" id="deselB">Deselect</button></div>
  <div class="etools" id="editTools">
    <button data-e="split"><b>◫</b>Split</button><button data-e="speed"><b>◷</b>Speed</button><button data-e="stab"><b>⛶</b>Stabilise</button><button data-e="freeze"><b>▮</b>Freeze</button><button data-e="rev"><b>↩</b>Reverse</button><button data-e="tr"><b>⧉</b>Transform</button><button data-e="more"><b>⋯</b>More</button>
  </div>
  <div class="tabb" id="tabb">
    <button data-t="edit" class="on"><b>✂</b>Edit</button><button data-t="color"><b>◍</b>Color</button><button data-t="audio"><b>∿</b>Audio</button><button data-t="text"><b>T</b>Text</button><button data-t="ov"><b>▣</b>Overlay</button>
  </div>
  <div id="cpanel" class="hidden"><div class="grip"></div><div id="cpBody"></div></div>
</div>
<input type="file" id="fileIn" accept="video/*,image/*" multiple class="hidden"/>
<input type="file" id="cubeIn" accept=".cube" class="hidden"/>
<div id="sheetRoot"></div>
<script>
"use strict";
/* ============ helpers ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT=s=>{s=Math.max(0,s|0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
/* ============ state ============ */
const S={project:null,selectedClip:null,playhead:0,undoStack:[],redoStack:[],muted:true,scopeOn:false,cmpOn:false,tab:'edit',cpanel:null,lookCat:'cinecut'};
let playTimer=null,lastPT=0;
/* ============ DB ============ */
const DB={db:null,
open(){return new Promise(res=>{const r=indexedDB.open('reshi-studio',1);
r.onupgradeneeded=e=>{const d=e.target.result;
if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});
if(!d.objectStoreNames.contains('luts'))d.createObjectStore('luts',{keyPath:'name'});
if(!d.objectStoreNames.contains('media'))d.createObjectStore('media',{keyPath:'id'});};
r.onsuccess=e=>{DB.db=e.target.result;res(1)};r.onerror=()=>res(0)});},
put(s,v){return new Promise(res=>{try{const t=DB.db.transaction(s,'readwrite');t.objectStore(s).put(v);t.oncomplete=()=>res(1)}catch(e){res(0)}});},
all(s){return new Promise(res=>{try{const t=DB.db.transaction(s,'readonly');const q=t.objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}});},
del(s,k){return new Promise(res=>{try{const t=DB.db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=()=>res(1)}catch(e){res(0)}});}};
/* ============ project ============ */
const Project={cur:null,
create(n){this.cur={id:'p'+Date.now(),name:n||'Untitled',created:Date.now(),modified:Date.now(),media:[],tracks:{video:[],audio:[]}};this.save();return this.cur;},
save(){if(!this.cur)return;this.cur.modified=Date.now();
const slim={...this.cur,media:this.cur.media.map(m=>({...m,blob:null,url:null}))};
DB.put('projects',slim);}};
/* ============ preview video ============ */
const previewVideo=document.createElement('video');
previewVideo.muted=true;previewVideo.playsInline=true;previewVideo.preload='auto';previewVideo.crossOrigin='anonymous';
/* ============ WebGL ============ */
let gl,texV,texL,texC,U={},glReady=false;
function initPreview(){
const cv=$('preview');
try{gl=cv.getContext('webgl',{antialias:false,preserveDrawingBuffer:true});}catch(e){}
if(!gl)return;
const vs='attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.,1.);}';
const fs=['precision mediump float;varying vec2 uv;',
'uniform sampler2D vTex,lTex,curveTex;uniform float lutN,inten,useLut;',
'uniform float expo,bright,cont,sat,temp,tint,hiL,shL;',
'uniform vec2 wSh,wMid,wHi;uniform vec3 hsl;uniform vec2 vig;uniform float sharp,grain,time;',
'uniform vec2 uWB;uniform vec2 warp;',
'vec3 applyLut(vec3 c){vec3 s=clamp(c,0.,1.)*(lutN-1.);float b0=floor(s.b),b1=min(b0+1.,lutN-1.);',
'vec2 tsz=vec2(lutN,lutN*lutN);',
'vec3 c0=texture2D(lTex,(vec2(s.r,s.g+b0*lutN)+.5)/tsz).rgb;',
'vec3 c1=texture2D(lTex,(vec2(s.r,s.g+b1*lutN)+.5)/tsz).rgb;',
'return mix(c0,c1,fract(s.b));}',
'vec3 rgb2hsv(vec3 c){vec4 K=vec4(0.,-1./3.,2./3.,-1.);',
'vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));',
'vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));',
'float d=q.x-min(q.w,q.y);float e=1.e-10;',
'return vec3(abs(q.z+(q.w-q.y)/(6.*d+e)),d/(q.x+e),q.x);}',
'vec3 hsv2rgb(vec3 c){vec4 K=vec4(1.,2./3.,1./3.,3.);',
'vec3 p=abs(fract(c.xxx+K.xyz)*6.-K.www);return c.z*mix(K.xxx,clamp(p-K.xxx,0.,1.),c.y);}',
'vec3 hue2rgb(float h){vec3 p=abs(fract(vec3(h,h+.3333,h+.6667))*6.-3.);return clamp(p-1.,0.,1.);}',
'float hash(vec2 co){return fract(sin(dot(co,vec2(12.9898,78.233))+time*61.7)*43758.5453);}',
'void main(){',
'vec3 c=texture2D(vTex,vec2(uv.x,1.-uv.y)).rgb;',
'c.r*=uWB.x;c.b*=uWB.y;',
'if(sharp>.001){vec3 nb=texture2D(vTex,vec2(uv.x,1.-uv.y)+vec2(.002,0.)).rgb+texture2D(vTex,vec2(uv.x,1.-uv.y)-vec2(.002,0.)).rgb;',
'c=clamp(c+(c-nb*.5)*sharp*3.,0.,1.);}',
'c*=pow(2.,expo);c+=bright;c=(c-.5)*(1.+cont)+.5;',
'float gg=dot(c,vec3(.299,.587,.114));c=mix(vec3(gg),c,1.+sat);',
'c.r*=1.+temp*.3;c.b*=1.-temp*.3;c.g*=1.+tint*.3;',
'float _hl=dot(c,vec3(.299,.587,.114));c*=1.+hiL*smoothstep(.55,1.,_hl);c*=1.+shL*(1.-smoothstep(0.,.45,_hl));',
'vec3 hc=rgb2hsv(clamp(c,0.,1.));',
'hc.x=fract(hc.x+warp.x);hc.y=clamp(hc.y*(1.+warp.y),0.,1.);c=hsv2rgb(hc);',
'float lum=dot(clamp(c,0.,1.),vec3(.299,.587,.114));',
'float zS=smoothstep(.45,.05,lum),zH=smoothstep(.55,.95,lum);float zM=max(0.,1.-zS-zH);',
'c+=hue2rgb(wSh.x)*(wSh.y*zS*.6);c+=hue2rgb(wMid.x)*(wMid.y*zM*.6);c+=hue2rgb(wHi.x)*(wHi.y*zH*.6);',
'hc=rgb2hsv(clamp(c,0.,1.));hc.x=fract(hc.x+hsl.x);hc.y=clamp(hc.y*(1.+hsl.y),0.,1.);c=hsv2rgb(hc)+hsl.z*.5;',
'vec3 gc=useLut>.5?applyLut(c):c;c=mix(c,gc,inten);',
'float vd=distance(uv,vec2(.5));float vr=clamp((vd-(.9-vig.y*.5))/.5,0.,1.);c*=1.-vr*vr*vig.x;',
'c+=(hash(uv*913.7)-.5)*grain*.3;',
'gl_FragColor=vec4(clamp(c,0.,1.),1.);}'].join('\n');
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const lc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lc);gl.vertexAttribPointer(lc,2,gl.FLOAT,false,0,0);
const mk=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t};
texV=mk();texL=mk();texC=mk();
gl.uniform1i(gl.getUniformLocation(pr,'vTex'),0);gl.uniform1i(gl.getUniformLocation(pr,'lTex'),1);gl.uniform1i(gl.getUniformLocation(pr,'curveTex'),2);

function curClip(){if(!S.project)return null;return S.project.tracks.video.find(c=>S.playhead>=c.start&&S.playhead<c.start+c.dur)||S.project.tracks.video[0]||null}
function col(){const c=S.selectedClip||curClip();if(c){c.color=c.color||defCol(c.color);return c.color}return defCol({})}
function defCol(c){c=c||{};c.wheels=c.wheels||{sh:{h:0,s:0},mid:{h:0,s:0},hi:{h:0,s:0}};c.hsl=c.hsl||{h:0,s:0,l:0};c.vignette=c.vignette||{a:0,s:50};c.wb=c.wb||{r:1,b:1};c.warp=c.warp||{h:0,s:0};

gl.viewport(0,0,cv.width,cv.height);
gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texV);
try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,previewVideo)}catch(e){return}

gl.uniform1f(U.expo,c.exposure||0);gl.uniform1f(U.bright,(c.brightness||0)/100);
gl.uniform1f(U.cont,(c.contrast||0)/100);gl.uniform1f(U.sat,(c.saturation||0)/100);
gl.uniform1f(U.temp,(c.temperature||0)/100);gl.uniform1f(U.tint,(c.tint||0)/100);
gl.uniform1f(U.hiL,(c.highlights||0)/100);gl.uniform1f(U.shL,(c.shadows||0)/100);
gl.uniform2f(U.uWB,(c.wb||{r:1}).r||1,(c.wb||{b:1}).b||1);

gl.uniform3f(U.hsl,(c.hsl.h||0)/180,(c.hsl.s||0)/100,(c.hsl.l||0)/100);
gl.uniform2f(U.vig,(c.vignette.a||0)/100,((c.vignette.s==null?50:c.vignette.s))/100);
gl.uniform1f(U.sharp,(c.sharpen||0)/100);gl.uniform1f(U.grain,(c.grain||0)/100);
gl.uniform1f(U.time,performance.now()/1000);

/* ============ LUTs ============ */
const lutCache=new Map();
function parseCube(tx){const L=tx.split('\n');let n=0;const d=[];
for(const l of L){const t=l.trim();if(!t||t[0]==='#')continue;const p=t.split(/\s+/);
if(p[0]==='LUT_3D_SIZE')n=+p[1];else if(p.length>=3&&n)d.push(+p[0],+p[1],+p[2]);}
if(!n||!d.length)throw new Error('bad cube');return{n,data:d}}
async function getLUT(nm){if(!nm)return null;if(lutCache.has(nm))return lutCache.get(nm);
const all=await DB.all('luts');const r=all.find(l=>l.name===nm);if(!r)return null;
try{const l=parseCube(r.text),n=l.n,tx=new Uint8Array(n*n*n*4);
for(let i=0;i<n*n*n;i++){tx[i*4]=clamp(l.data[i*3]*255,0,255);tx[i*4+1]=clamp(l.data[i*3+1]*255,0,255);tx[i*4+2]=clamp(l.data[i*3+2]*255,0,255);tx[i*4+3]=255}
const o={n,tex:tx};lutCache.set(nm,o);return o}catch(e){return null}}
function getLUTSync(n){return(n&&lutCache.get(n))||null}
function warmLUTCache(){if(!S.project)return;const s=new Set();for(const c of S.project.tracks.video)if(c.lut)s.add(c.lut);s.forEach(n=>getLUT(n))}
/* built-in looks (procedural 16^3 LUTs) */
function mkLUT(fn){const n=16,tx=new Uint8Array(n*n*n*4);let i=0;
for(let b=0;b<n;b++)for(let g=0;g<n;g++)for(let r=0;r<n;r++){const c=fn(r/15,g/15,b/15);tx[i++]=clamp(c[0]*255,0,255);tx[i++]=clamp(c[1]*255,0,255);tx[i++]=clamp(c[2]*255,0,255);tx[i++]=255}
return{n,tex:tx}}
const BUILTINS=[
{n:'Summer Heat',hdr:1,f:(r,g,b)=>[clamp(r*1.12+.04,0,1),clamp(g*1.02,0,1),clamp(b*.88,0,1)]},
{n:'HDR Rain',hdr:1,f:(r,g,b)=>{const l=r*.3+g*.6+b*.1;return[clamp(r*.92+l*.08,0,1),clamp(g*.95+l*.05,0,1),clamp(b*1.08,0,1)]}},
{n:'Twilight Hour',hdr:1,f:(r,g,b)=>[clamp(r*1.05+.03,0,1),clamp(g*.94+.02,0,1),clamp(b*1.1,0,1)]},
{n:'Mountain Air',hdr:1,f:(r,g,b)=>[clamp(r*.9,0,1),clamp(g*.98,0,1),clamp(b*1.14+.02,0,1)]},
{n:'Golden Film',hdr:0,f:(r,g,b)=>[clamp(r*1.08+.05,0,1),clamp(g*1.0+.02,0,1),clamp(b*.9,0,1)]},
{n:'Noir',hdr:0,f:(r,g,b)=>{const l=r*.3+g*.6+b*.1;return[l*.95,l*.95,l*1.02]}}];
function regBuiltins(){for(const b of BUILTINS)if(!lutCache.has(b.n))lutCache.set(b.n,mkLUT(b.f))}

let gW={};
function renderGrade(){const b=$('cpBody');const c=col();
b.innerHTML=pHead('Grade','◍')+'<div class="sub2">'+['3-Way','Shadows','Mids','Highlights','Global'].map((x,i)=>'<button class="'+(i===0?'on':'')+'">'+x+'</button>').join('')+'</div>'
+'<div class="wheels3">'+[['sh','Shadows'],['mid','Midtones'],['hi','Highlights']].map(w=>'<div class="wb"><b style="font-size:.8rem;color:var(--txt)">'+w[1]+'</b><canvas id="gw_'+w[0]+'" width="104" height="104"></canvas><input type="range" id="gl_'+w[0]+'" min="-100" max="100" value="'+Math.round(((c['lum_'+w[0]])||0))+'"/><div class="lv">Lum <span id="glv_'+w[0]+'">'+Math.round(c['lum_'+w[0]]||0)+'</span></div></div>').join('')+'</div>'
+sRow('Blending','gBlend',0,100,1,50,v=>v)+sRow('Balance','gBal',-100,100,1,0,v=>v);
bindPHead(b,()=>{const cc=col();cc.wheels={sh:{h:0,s:0},mid:{h:0,s:0},hi:{h:0,s:0}};syncGW()});
b.querySelectorAll('.sub2 button').forEach(x=>x.onclick=()=>{b.querySelectorAll('.sub2 button').forEach(y=>y.classList.remove('on'));x.classList.add('on')});
['sh','mid','hi'].forEach(k=>{gW[k]=mkWheel('gw_'+k);
gW[k].set(c.wheels[k].h||0,c.wheels[k].s||0);
gW[k].onInput=(h,s)=>{const cc=col();cc.wheels[k]={h,s};pushU();drawPreview()};
gW[k].onCommit=()=>Project.save();
$('gl_'+k).oninput=e=>{const cc=col();cc['lum_'+k]=+e.target.value;$('glv_'+k).textContent=e.target.value;pushU();drawPreview()};
$('gl_'+k).onchange=()=>Project.save()});
bindS('gBlend','blend',v=>v,1);bindS('gBal','gbal',v=>v,1)}
function syncGW(){const c=col();['sh','mid','hi'].forEach(k=>{if(gW[k])gW[k].set(c.wheels[k].h||0,c.wheels[k].s||0)})}
function mkWheel(id){const cv=$(id),ctx=cv.getContext('2d');const W=cv.width,C=W/2,R=C-6;
let h=0,s=0,drag=false,sil=false,cb=null,ccb=null;
function draw(){ctx.clearRect(0,0,W,W);
for(let a=0;a<360;a+=6){ctx.strokeStyle='hsl('+a+',80%,55%)';ctx.lineWidth=10;ctx.beginPath();ctx.arc(C,C,R-6,(a-93)*Math.PI/180,(a-87)*Math.PI/180);ctx.stroke()}
ctx.fillStyle='#f2f2f7';ctx.beginPath();ctx.arc(C,C,R-12,0,7);ctx.fill();
const an=h*Math.PI*2-Math.PI/2,d2=s*(R-12);
ctx.fillStyle='hsl('+(h*360)+',85%,55%)';ctx.beginPath();ctx.arc(C+Math.cos(an)*d2,C+Math.sin(an)*d2,7,0,7);ctx.fill();
ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}
function ev(e){const r=cv.getBoundingClientRect();
const x=((e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX)-r.left)*(W/r.width)-C;
const y=((e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY)-r.top)*(W/r.height)-C;
s=Math.min(1,Math.hypot(x,y)/(R-12));h=(((Math.atan2(y,x)+Math.PI/2)/(Math.PI*2))%1+1)%1;draw();if(!sil&&cb)cb(h,s)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();drag=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}ev(e)});
cv.addEventListener('pointermove',e=>{if(drag)ev(e)});
cv.addEventListener('pointerup',()=>{drag=false;if(ccb)ccb()});cv.addEventListener('pointercancel',()=>drag=false);
draw();return{onInput:f=>cb=f,onCommit:f=>ccb=f,set:(hh,ss)=>{sil=true;h=hh;s=ss;draw();sil=false}}}
/* ---- COLOR WARPER ---- */
let warpPts=[];
function renderWarper(){const b=$('cpBody');
b.innerHTML=pHead('Color Warper','✿')+'<div class="seg" style="max-width:280px;margin:0 auto 6px"><button data-sc="this">This clip</button><button data-sc="all" class="on">All clips</button></div>'
+'<canvas id="warper" width="280" height="280"></canvas>'
+'<p class="help">Drag a point to move those colours: around the wheel changes hue, in and out changes saturation. Double-tap a point to put it back.</p>';
bindPHead(b,()=>{const cc=col();cc.warp={h:0,s:0};warpPts=[];drawWarper()});
b.querySelectorAll('[data-sc]').forEach(x=>x.onclick=()=>{b.querySelectorAll('[data-sc]').forEach(y=>y.classList.remove('on'));x.classList.add('on')});
initWarper()}
function initWarper(){const cv=$('warper'),ctx=cv.getContext('2d');const C=140,R=120;
if(!warpPts.length){warpPts=[];for(let ring=0;ring<3;ring++)for(let i=0;i<12;i++){const a=i/12*Math.PI*2,r2=R*(0.35+ring*0.28);
warpPts.push({a,r:r2,da:0,dr:0})}}
let drag=-1;
function draw(){ctx.clearRect(0,0,280,280);
const g=ctx.createConicGradient?ctx.createConicGradient(0,C,C):null;
for(let a=0;a<360;a+=10){ctx.strokeStyle='hsl('+a+',70%,55%)';ctx.lineWidth=14;ctx.beginPath();ctx.arc(C,C,R-8,(a-95)*Math.PI/180,(a-85)*Math.PI/180);ctx.stroke()}
ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=1;
for(let ring=0;ring<3;ring++){ctx.beginPath();ctx.arc(C,C,R*(0.35+ring*0.28),0,7);ctx.stroke()}
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ctx.beginPath();ctx.moveTo(C,C);ctx.lineTo(C+Math.cos(a)*R,C+Math.sin(a)*R);ctx.stroke()}
warpPts.forEach((p,i)=>{const a=p.a+p.da,r2=Math.min(R,Math.max(10,p.r+p.dr));
const x=C+Math.cos(a)*r2,y=C+Math.sin(a)*r2;
ctx.fillStyle=(p.da||p.dr)?'#ff9f43':'#fff';ctx.beginPath();ctx.arc(x,y,i===drag?8:6,0,7);ctx.fill();
ctx.strokeStyle='#999';ctx.lineWidth=1.5;ctx.stroke()})}
function drawWarper(){draw()}
function pos(e){const r=cv.getBoundingClientRect();return[((e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX)-r.left)*(280/r.width),((e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY)-r.top)*(280/r.height)]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const[x,y]=pos(e);let bi=-1,bd=20;
warpPts.forEach((p,i)=>{const a=p.a+p.da,r2=p.r+p.dr;const px=C+Math.cos(a)*r2,py=C+Math.sin(a)*r2;
const d=Math.hypot(x-px,y-py);if(d<bd){bd=d;bi=i}});drag=bi;try{cv.setPointerCapture(e.pointerId)}catch(_){}draw()});
cv.addEventListener('pointermove',e=>{if(drag<0)return;const[x,y]=pos(e);const p=warpPts[drag];
let na=Math.atan2(y-C,x-C),nr=Math.hypot(x-C,y-C);
let da=na-p.a;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
p.da=clamp(da,-.6,.6);p.dr=clamp(nr-p.r,-40,40);draw();applyWarp()});
const up=()=>{if(drag>=0){drag=-1;draw();Project.save()}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('dblclick',e=>{const[x,y]=pos(e);warpPts.forEach(p=>{const a=p.a+p.da,r2=p.r+p.dr;
if(Math.hypot(x-(C+Math.cos(a)*r2),y-(C+Math.sin(a)*r2))<14){p.da=0;p.dr=0}});draw();applyWarp();Project.save()});
draw()}
function applyWarp(){let mh=0,ms=0,n=0;for(const p of warpPts){if(p.da||p.dr){mh+=p.da;n++;ms+=p.dr}}
const cc=col();pushU();
cc.warp={h:n?Math.round(mh/n*57.3*3):0,s:n?Math.round(ms/n/1.2):0};
drawPreview()}

+sRow('Light','rlL',0,200,1,140,v=>v)+sRow('Height','rlH',0,100,1,50,v=>v)+sRow('Warmth','rlW',-100,100,1,40,v=>(v>=0?'+':'')+v)+sRow('Softness','rlS',0,100,1,0,v=>v)+sRow('Surroundings','rlSu',-100,100,1,-50,v=>(v>=0?'+':'')+v)
+'<p class="help">Drag the light ☀ in the viewer to place it. Relight is approximated with exposure, warmth and vignette.</p>';

/* ============ tab bar ============ */
const TABS={edit:'Edit',color:'Color',audio:'Audio',text:'Text',ov:'Overlay'};
$('tabb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
document.querySelectorAll('#tabb button').forEach(x=>x.classList.remove('on'));b.classList.add('on');

function colorSub(t){const names={color:['Looks','Film','Grade','Warper','Relight'],audio:['Volume','Fade'],text:['Add Text'],ov:['Add Overlay']};
const b=$('cpBody');S.cpanel='sub';$('cpanel').classList.remove('hidden');

else if(n==='Text'){el.innerHTML='<button class="btn" id="tAdd">Add Text</button>';$('tAdd').onclick=()=>{const c=S.selectedClip;if(!c)return;pushU();c.text=c.text||[];c.text.push({txt:'Title',size:32,x:50,y:50,color:'#fff'});drawPreview();Project.save()}}
else el.innerHTML='<p class="help">Audio: use Volume above. Overlay: coming soon.</p>'};

$('editTools').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.e;
if(k==='split')splitClip();else if(k==='speed'){const c=S.selectedClip;if(!c)return;const v=prompt('Speed (0.25 - 4):',c.speed||1);if(v){pushUndo();c.speed=clamp(+v,.25,4);renderAll();Project.save()}}
else if(k==='freeze'){alert('Freeze: not in this build')}
else if(k==='rev'){alert('Reverse: not in this build')}

else alert('Coming soon')});
/* ============ export ============ */
let expCancel=false;
$('expBtn').onclick=()=>{const r=$('sheetRoot');
r.innerHTML='<div class="sheet" id="sh"><div class="bx"><h3>Export</h3>'
+'<div class="orow"><label>Format</label><select id="eFmt"><option>MP4</option><option>MOV</option></select></div>'
+'<div class="orow"><label>Resolution</label><select id="eRes"><option value="orig">Original</option><option value="480">480p</option><option value="720">720p</option><option value="1080" selected>1080p</option><option value="2160">4K</option></select></div>'
+'<div class="orow"><label>Bit Rate</label><select id="eQ"><option value="medium">Medium</option><option value="high">High</option><option value="max">Maximum</option></select></div>'
+'<div class="orow"><label>Codec</label><select id="eC"><option>H.264</option><option>HEVC</option></select></div>'
+'<div id="expBarW"><div id="expBar"></div></div><div id="expMsg" class="help"></div><div id="expDl"></div>'
+'<button class="bigbtn" id="eGo">Export Video</button><button class="ghostb" id="eX">Cancel</button></div></div>';
$('sh').onclick=e=>{if(e.target.id==='sh')r.innerHTML=''};
$('eX').onclick=()=>r.innerHTML='';$('eGo').onclick=doExport};
async function doExport(){const btn=$('eGo');btn.disabled=true;btn.textContent='Rendering…';expCancel=false;
try{await exportSimple({res:$('eRes').value,q:$('eQ').value})}catch(e){$('expMsg').textContent='Failed: '+e.message}
btn.disabled=false;btn.textContent='Export Video'}
async function exportSimple(o){o=o||{};const clips=S.project.tracks.video;if(!clips.length)throw new Error('No clips');
const m0=S.project.media.find(x=>x.id===clips[0].mediaId);
let W=(m0&&m0.w)||1280,H=(m0&&m0.h)||720;
if(o.res&&o.res!=='orig'){const s=+o.res/Math.min(W,H);W=Math.round(W*s)&~1;H=Math.round(H*s)&~1}
const fps=30,qm={medium:8e6,high:14e6,max:30e6},br=Math.min(qm[o.q||'high'],80e6);
const{Muxer,ArrayBufferTarget}=await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.mjs');
const mx=new Muxer({target:new ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},fastStart:'in-memory'});
const enc=new VideoEncoder({output:(c,m)=>mx.addVideoChunk(c,m),error:e=>{throw e}});
enc.configure({codec:W*H>3200000?'avc1.640033':'avc1.640028',width:W,height:H,bitrate:br,framerate:fps});
if(playTimer)togglePlay();
const sv=S.playhead,v=previewVideo,pv=$('preview');
const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');
const tot=tlDuration(),steps=Math.max(1,Math.ceil(tot*fps));
try{for(let i=0;i<steps;i++){if(expCancel)throw new Error('Cancelled');
const t=Math.min(i/fps,Math.max(0,tot-.001));const clip=clips.find(c=>t>=c.start&&t<c.start+c.dur);S.playhead=t;
if(clip){const m=S.project.media.find(x=>x.id===clip.mediaId);
if(m&&m.type==='video'){if(v.src!==m.url){v.src=m.url;v.muted=true}
const lt=Math.min(clip.trimS+(t-clip.start),Math.max(0,(m.duration||0)-.04));
if(Math.abs(v.currentTime-lt)>.05)await new Promise(r2=>{const to=setTimeout(r2,800);v.onseeked=()=>{clearTimeout(to);r2()};try{v.currentTime=lt}catch(e){clearTimeout(to);r2()}})}}
drawPreview();cx.fillStyle='#000';cx.fillRect(0,0,W,H);
const pr=pv.width/Math.max(1,pv.height),or=W/H;let dw,dh;
if(pr>or){dh=H;dw=H*pr}else{dw=W;dh=W/pr}
try{cx.drawImage(pv,(W-dw)/2,(H-dh)/2,dw,dh)}catch(e){}
const vf=new VideoFrame(cv,{timestamp:Math.round(t*1e6),duration:Math.round(1e6/fps)});
enc.encode(vf,{keyFrame:i%90===0});vf.close();
const p=Math.round(i/steps*100);$('expBar').style.width=p+'%';$('expMsg').textContent='Rendering… '+p+'%';
if(i%15===0)await new Promise(r=>setTimeout(r,0))}
await enc.flush();enc.close();mx.finalize();
const blob=new Blob([mx.target.buffer],{type:'video/mp4'});const u=URL.createObjectURL(blob);
$('expDl').innerHTML='<a href="'+u+'" download="reshi-'+Date.now()+'.mp4" class="bigbtn" style="display:block;text-align:center;text-decoration:none">⬇ Download ('+(blob.size/1048576).toFixed(1)+' MB)</a>';
$('expMsg').textContent='Done ✓'}finally{S.playhead=sv;drawPreview()}}
