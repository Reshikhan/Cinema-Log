<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Reshi Studio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:#fff;color:#000;min-height:100vh}
.hidden{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;font-weight:800;margin-bottom:4px}
.sub{color:#8e8e93;font-size:.85rem;margin-bottom:24px}
/* big buttons */
.bigbtn{display:block;width:100%;padding:18px;border:none;border-radius:16px;font-size:1.05rem;font-weight:700;margin-bottom:12px;cursor:pointer}
.bigbtn.blue{background:#007aff;color:#fff}
.bigbtn.orange{background:#ff9f43;color:#fff}
.bigbtn.gray{background:#f2f2f7;color:#000}
.bigbtn.green{background:#34c759;color:#fff}
/* video */
.vwrap{background:#000;border-radius:16px;overflow:hidden;margin-bottom:16px;position:relative}
.vwrap video{width:100%;display:block;max-height:50vh}
.vwrap canvas{width:100%;display:block;max-height:50vh}
/* choice buttons */
.choices{display:flex;gap:12px;margin-bottom:16px}
.choices button{flex:1;padding:16px;border:none;border-radius:14px;font-size:.95rem;font-weight:700;cursor:pointer}
.choices .lut{background:#ff9f43;color:#fff}
.choices .edit{background:#f2f2f7;color:#000}
/* lut grid */
.lutgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.lut{border:2px solid #e5e5ea;border-radius:12px;background:#fff;padding:12px 6px;text-align:center;cursor:pointer;font-size:.75rem}
.lut.on{border-color:#ff9f43;background:#fff8f0}
.lut .ic{font-size:1.8rem;margin-bottom:4px}
/* sliders */
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f2f2f7}
.srow label{width:100px;font-size:.9rem;flex-shrink:0}
.srow input{flex:1}
.srow span{width:50px;text-align:right;font-size:.9rem;color:#666}
/* tools */
.tools{display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin-bottom:16px}
.tool{flex-shrink:0;padding:12px 18px;border:1px solid #e5e5ea;background:#fff;border-radius:12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.tool.on{background:#000;color:#fff;border-color:#000}
/* text list */
.trow{display:flex;gap:8px;margin-bottom:8px}
.trow input{flex:1;padding:12px;border:1px solid #e5e5ea;border-radius:10px;font-size:.95rem}
.trow button{padding:12px 16px;border:none;background:#ff3b30;color:#fff;border-radius:10px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:340px}
.modal h3{margin-bottom:14px}
.modal input{width:100%;padding:13px;border:1px solid #e5e5ea;border-radius:10px;font-size:1rem;margin-bottom:14px}
.modal .btns{display:flex;gap:10px}
.modal .btns button{flex:1;padding:13px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.prog{height:10px;background:#f2f2f7;border-radius:5px;overflow:hidden;margin:14px 0}
.prog i{display:block;height:100%;background:#34c759;width:0%}
#err{position:fixed;top:0;left:0;right:0;background:#ff3b30;color:#fff;padding:12px;z-index:999;font-size:.85rem;display:none}
.backbtn{background:none;border:none;font-size:1rem;color:#007aff;margin-bottom:12px;cursor:pointer;padding:8px 0}
</style>
</head>
<body>
<div id="err"></div>

<!-- HOME -->
<div id="home" class="wrap">
  <h1>✂️ Reshi Studio</h1>
  <div class="sub">Simple video editor with LUTs</div>
  <button class="bigbtn blue" id="importBtn">📁 Import Video</button>
  <button class="bigbtn orange" id="recordBtn">🔴 Record Video</button>
  <div class="sub" style="margin-top:20px;text-align:center">Your videos stay on your device.<br/>Nothing uploads anywhere.</div>
</div>

<!-- VIDEO -->
<div id="vidscreen" class="wrap hidden">
  <button class="backbtn" id="backBtn">‹ Back</button>
  <div class="vwrap">
    <video id="v" controls playsinline></video>
    <canvas id="c" class="hidden"></canvas>
  </div>
  <div class="choices">
    <button class="lut" id="lutBtn">🎨 Add LUTs</button>
    <button class="edit" id="editBtn">✂️ Edit</button>
  </div>
  <button class="bigbtn green hidden" id="dlBtn">⬇ Download Video</button>

  <!-- LUT PANEL -->
  <div id="lutPanel" class="hidden">
    <h3 style="margin-bottom:12px">Choose a LUT</h3>
    <div class="lutgrid" id="lutGrid"></div>
    <div class="srow"><label>Strength</label><input type="range" id="lutStr" min="0" max="100" value="100"/><span id="lutStrV">100</span></div>
    <button class="bigbtn gray" id="lutOff">Original (No LUT)</button>
  </div>

  <!-- EDIT PANEL -->
  <div id="editPanel" class="hidden">
    <h3 style="margin-bottom:12px">Edit</h3>
    <div class="tools">
      <button class="tool" id="tSpeed">Speed</button>
      <button class="tool" id="tText">Add Text</button>
      <button class="tool" id="tMute">Mute</button>
    </div>
    <div id="textList"></div>
    <div class="srow"><label>Brightness</label><input type="range" id="eBright" min="-100" max="100" value="0"/><span id="eBrightV">0</span></div>
    <div class="srow"><label>Contrast</label><input type="range" id="eCont" min="-100" max="100" value="0"/><span id="eContV">0</span></div>
    <div class="srow"><label>Saturation</label><input type="range" id="eSat" min="-100" max="100" value="0"/><span id="eSatV">0</span></div>
  </div>
</div>

<input type="file" id="fileIn" accept="video/*" style="display:none"/>

<script>
"use strict";
const $=id=>document.getElementById(id);
function err(m){ const e=$('err'); e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',3000); }
window.onerror=(m)=>{ err('Error: '+m); };

let videoUrl=null, curLUT=null, lutData=null, lutSize=0;
let texts=[], muted=false, speed=1, bright=0, cont=0, sat=0;

const LUTS=[
 'Cine_wedding.cube','Cinematic_Lut_V2.cube','Cinematic_Lut_V2_2.cube',
 'well-see.CUBE','Going_for_a_walk.CUBE','Once_upon_a_time.CUBE',
 'SONY_HL.cube','Sony-CL-AZ.cube','Apple-Log_XZ1.cube',
 'DJI_OSMO_Action_4_D-Log_M_to_Rec.709_V1_2.cube','FGCineVibrant.cube',
 'Golden_Forest_35.A035_04040921_C008__1.cube','lut_1.rabbit-5639615.cube',
 'sony_lut_1.Animals_09___4K_res.cube'
];

/* ---------- HOME ---------- */
$('importBtn').onclick=()=>$('fileIn').click();
$('recordBtn').onclick=()=>{
  // Use native camera via file input with capture
  const i=document.createElement('input');
  i.type='file'; i.accept='video/*'; i.capture='environment';
  i.onchange=e=>{ if(e.target.files[0]) loadVideo(e.target.files[0]); };
  i.click();
};
$('fileIn').onchange=e=>{ if(e.target.files[0]) loadVideo(e.target.files[0]); e.target.value=''; };

function loadVideo(file){
  if(videoUrl) URL.revokeObjectURL(videoUrl);
  videoUrl=URL.createObjectURL(file);
  const v=$('v');
  v.src=videoUrl; v.muted=false;
  $('home').classList.add('hidden');
  $('vidscreen').classList.remove('hidden');
  $('lutPanel').classList.add('hidden');
  $('editPanel').classList.add('hidden');
  $('c').classList.add('hidden'); v.classList.remove('hidden');
  curLUT=null; texts=[]; renderTexts();
  v.play().catch(()=>{});
}

/* ---------- NAV ---------- */
$('backBtn').onclick=()=>{
  $('vidscreen').classList.add('hidden');
  $('home').classList.remove('hidden');
  $('v').pause();
};
$('lutBtn').onclick=()=>{
  $('lutPanel').classList.remove('hidden');
  $('editPanel').classList.add('hidden');
  buildLUTs();
};
$('editBtn').onclick=()=>{
  $('editPanel').classList.remove('hidden');
  $('lutPanel').classList.add('hidden');
};

/* ---------- LUTS ---------- */
function buildLUTs(){
  const g=$('lutGrid'); g.innerHTML='';
  LUTS.forEach(fn=>{
    const nm=fn.replace(/\.cube$/i,'').replace(/_/g,' ').substring(0,14);
    const d=document.createElement('button');
    d.className='lut'+(curLUT===fn?' on':'');
    d.innerHTML='<div class="ic">🎨</div>'+nm;
    d.onclick=()=>applyLUT(fn);
    g.appendChild(d);
  });
}
$('lutOff').onclick=()=>{
  curLUT=null; lutData=null;
  $('c').classList.add('hidden'); $('v').classList.remove('hidden');
  $('v').play().catch(()=>{});
  buildLUTs();
};
$('lutStr').oninput=e=>{
  $('lutStrV').textContent=e.target.value;
  if(curLUT) renderLUTFrame();
};

async function applyLUT(fn){
  curLUT=fn;
  $('v').pause();
  try{
    const r=await fetch('luts/'+fn);
    if(!r.ok) throw new Error('not found');
    const txt=await r.text();
    const p=parseCube(txt);
    if(!p.size) throw new Error('parse fail');
    lutData=p.data; lutSize=p.size;
    $('v').classList.add('hidden');
    $('c').classList.remove('hidden');
    renderLUTFrame();
    // keep rendering while video plays
    startLUTLoop();
  }catch(e){ err('Could not load LUT: '+fn); curLUT=null; }
  buildLUTs();
}
function parseCube(txt){
  const lines=txt.split(/\r?\n/); let size=0; const data=[];
  for(const ln of lines){
    const l=ln.trim();
    if(!l||l[0]==='#') continue;
    if(l.startsWith('LUT_3D_SIZE')){ size=parseInt(l.split(/\s+/)[1]); continue; }
    if(l.startsWith('TITLE')||l.startsWith('DOMAIN')) continue;
    const p=l.split(/\s+/).map(Number);
    if(p.length>=3&&p.every(v=>!isNaN(v))) data.push(p[0],p[1],p[2]);
  }
  return {size,data:new Float32Array(data)};
}
let lutLoop=null;
function startLUTLoop(){
  if(lutLoop) cancelAnimationFrame(lutLoop);
  const v=$('v'), c=$('c');
  const loop=()=>{
    if(curLUT&&!$('c').classList.contains('hidden')){
      renderLUTFrame();
      lutLoop=requestAnimationFrame(loop);
    }
  };
  // play video muted in background for frames
  v.muted=true; v.play().catch(()=>{});
  loop();
}
function renderLUTFrame(){
  const v=$('v'), c=$('c');
  if(v.readyState<2||v.videoWidth===0) return;
  if(c.width!==v.videoWidth){ c.width=v.videoWidth; c.height=v.videoHeight; }
  const ctx=c.getContext('2d');
  ctx.drawImage(v,0,0);
  if(!lutData||!lutSize) return;
  const str=$('lutStr').value/100;
  if(str===0) return;
  try{
    const img=ctx.getImageData(0,0,c.width,c.height);
    const d=img.data, sz=lutSize;
    for(let i=0;i<d.length;i+=4){
      const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;
      const lr=applyLUTPixel(r,g,b);
      d[i]  =d[i]  *(1-str)+lr[0]*255*str;
      d[i+1]=d[i+1]*(1-str)+lr[1]*255*str;
      d[i+2]=d[i+2]*(1-str)+lr[2]*255*str;
    }
    ctx.putImageData(img,0,0);
    // draw texts
    drawTexts(ctx,c.width,c.height);
  }catch(e){}
}
function applyLUTPixel(r,g,b){
  const sz=lutSize, d=lutData;
  const rs=r*(sz-1),gs=g*(sz-1),bs=b*(sz-1);
  const r0=Math.floor(rs),g0=Math.floor(gs),b0=Math.floor(bs);
  const r1=Math.min(r0+1,sz-1),g1=Math.min(g0+1,sz-1),b1=Math.min(b0+1,sz-1);
  const fr=rs-r0,fg=gs-g0,fb=bs-b0;
  const idx=(z,y,x)=>((z*sz+y)*sz+x)*3;
  const c000=[d[idx(b0,g0,r0)],d[idx(b0,g0,r0)+1],d[idx(b0,g0,r0)+2]];
  const c100=[d[idx(b0,g0,r1)],d[idx(b0,g0,r1)+1],d[idx(b0,g0,r1)+2]];
  const c010=[d[idx(b0,g1,r0)],d[idx(b0,g1,r0)+1],d[idx(b0,g1,r0)+2]];
  const c110=[d[idx(b0,g1,r1)],d[idx(b0,g1,r1)+1],d[idx(b0,g1,r1)+2]];
  const c001=[d[idx(b1,g0,r0)],d[idx(b1,g0,r0)+1],d[idx(b1,g0,r0)+2]];
  const c101=[d[idx(b1,g0,r1)],d[idx(b1,g0,r1)+1],d[idx(b1,g0,r1)+2]];
  const c011=[d[idx(b1,g1,r0)],d[idx(b1,g1,r0)+1],d[idx(b1,g1,r0)+2]];
  const c111=[d[idx(b1,g1,r1)],d[idx(b1,g1,r1)+1],d[idx(b1,g1,r1)+2]];
  const mix=(a,b,t)=>a+(b-a)*t;
  const c00=c000.map((v,i)=>mix(v,c100[i],fr));
  const c10=c010.map((v,i)=>mix(v,c110[i],fr));
  const c01=c001.map((v,i)=>mix(v,c101[i],fr));
  const c11=c011.map((v,i)=>mix(v,c111[i],fr));
  const c0=c00.map((v,i)=>mix(v,c10[i],fg));
  const c1=c01.map((v,i)=>mix(v,c11[i],fg));
  return c0.map((v,i)=>mix(v,c1[i],fb));
}

/* ---------- EDIT ---------- */
$('tSpeed').onclick=()=>{
  const s=prompt('Speed (0.25 - 4):',speed);
  if(s){ speed=parseFloat(s)||1; $('v').playbackRate=speed; }
};
$('tMute').onclick=()=>{
  muted=!muted; $('v').muted=muted;
  $('tMute').textContent=muted?'Unmute':'Mute';
  $('tMute').classList.toggle('on',muted);
};
$('tText').onclick=()=>{
  const t=prompt('Text:','Title');
  if(t){ texts.push(t); renderTexts(); }
};
function renderTexts(){
  const l=$('textList'); l.innerHTML='';
  texts.forEach((t,i)=>{
    const r=document.createElement('div'); r.className='trow';
    r.innerHTML='<input value="'+t.replace(/"/g,'&quot;')+'"/><button>✕</button>';
    r.querySelector('input').onchange=e=>{ texts[i]=e.target.value; };
    r.querySelector('button').onclick=()=>{ texts.splice(i,1); renderTexts(); };
    l.appendChild(r);
  });
}
function drawTexts(ctx,w,h){
  ctx.fillStyle='#fff'; ctx.font='bold '+Math.round(h/12)+'px sans-serif';
  ctx.textAlign='center'; ctx.strokeStyle='#000'; ctx.lineWidth=3;
  texts.forEach((t,i)=>{
    const y=h/3+i*(h/10);
    ctx.strokeText(t,w/2,y); ctx.fillText(t,w/2,y);
  });
}
function applyFilters(){
  const v=$('v');
  v.style.filter='brightness('+(1+bright/100)+') contrast('+(1+cont/100)+') saturate('+(1+sat/100)+')';
}
$('eBright').oninput=e=>{ bright=+e.target.value; $('eBrightV').textContent=bright; applyFilters(); };
$('eCont').oninput=e=>{ cont=+e.target.value; $('eContV').textContent=cont; applyFilters(); };
$('eSat').oninput=e=>{ sat=+e.target.value; $('eSatV').textContent=sat; applyFilters(); };

/* ---------- DOWNLOAD ---------- */
$('dlBtn').classList.remove('hidden');
$('dlBtn').onclick=async()=>{
  const v=$('v');
  err('Preparing download...');
  try{
    const c=document.createElement('canvas');
    c.width=v.videoWidth||720; c.height=v.videoHeight||1280;
    const ctx=c.getContext('2d');
    const stream=c.captureStream(30);
    const rec=new MediaRecorder(stream,{mimeType:'video/webm'});
    const chunks=[]; rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    const done=new Promise(r=>rec.onstop=r);
    rec.start();
    v.currentTime=0; v.muted=false; await v.play().catch(()=>{});
    const dur=v.duration||5;
    const start=Date.now();
    await new Promise(res=>{
      const iv=setInterval(()=>{
        if(v.videoWidth){ ctx.drawImage(v,0,0,c.width,c.height); drawTexts(ctx,c.width,c.height); }
        if(v.ended||v.currentTime>=dur||Date.now()-start>dur*1000+2000){ clearInterval(iv); res(); }
      },33);
    });
    rec.stop(); await done;
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='reshi-video.webm'; a.click();
    err('Downloaded!');
  }catch(e){ err('Export failed: '+e.message); }
};
</script>
</body>
</html>
