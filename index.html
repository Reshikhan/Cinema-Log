<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0d0d0d"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Reshi Studio — Liquid Glass</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--acc:#E2A03F;--bg:#0D0D0D;--sf:#171717;--bd:#262626;
  --glass:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 55%,rgba(255,255,255,.10));
  --glass-bd:rgba(255,255,255,.28);--glass-hi:rgba(255,255,255,.45)}
html,body{height:100%;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:#fff;
  display:flex;justify-content:center;min-height:100vh;min-height:100dvh;overflow:hidden;
  -webkit-user-select:none;user-select:none}
/* Liquid Glass needs something to refract: soft colour field behind the app (PC/tablet, and behind glass panels) */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(600px 400px at 15% 10%,rgba(0,122,255,.28),transparent 60%),
  radial-gradient(600px 400px at 85% 20%,rgba(175,82,222,.24),transparent 60%),
  radial-gradient(700px 500px at 50% 100%,rgba(226,160,63,.18),transparent 60%),#0d0d0d}
.hidden{display:none!important}
/* Liquid Glass panel: frosted, saturated, specular edge. -webkit- prefix is what iOS Safari actually uses. */
.glass{background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--glass-bd);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.08),0 12px 32px rgba(0,0,0,.38)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:rgba(24,24,24,.94);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media(prefers-reduced-transparency:reduce){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(24,24,24,.96)}
}
/* Responsive shell: phone = full screen; tablet = wider; PC = wide editor, not a phone frame */
#app{width:100%;max-width:480px;height:100%;height:100dvh;display:flex;flex-direction:column;
  background:rgba(13,13,13,.72);position:relative;overflow:hidden;z-index:1;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#ed{display:flex;flex-direction:column;height:100%}
@media(min-width:520px){
  body{align-items:center;padding:20px}
  #app{max-width:720px;height:min(92vh,900px);border-radius:32px;border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 60px rgba(0,0,0,.6)}
}
@media(min-width:1000px){
  #app{max-width:1180px;height:min(92vh,860px)}
  /* Desktop editor: video left, glass control panel right */
  #ed{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr auto;grid-template-areas:"hdr hdr" "vp lut" "vp act"}
  #ed .hdr{grid-area:hdr}
  #ed .vp{grid-area:vp}
  #ed .prog{grid-area:vp;align-self:end;margin:0 12px 12px}
  #ed .lutbar{grid-area:lut;border-top:none;border-left:1px solid var(--bd);overflow-y:auto}
  #ed .actions{grid-area:act;border-top:1px solid var(--bd);border-left:1px solid var(--bd)}
  #ed .luts{flex-wrap:wrap;overflow:visible}
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
/* header — floating Liquid Glass pill over the video */
.hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-shrink:0;
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 var(--glass-hi);
  padding-top:calc(10px + env(safe-area-inset-top))}
.hdr .bk{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:1.1rem;flex-shrink:0}
.hdr .tt{flex:1;min-width:0}.hdr .tt b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .tt small{color:#c7c7cc;font-size:.66rem}
.hdr .exp{background:var(--acc);color:#000;font-weight:700;font-size:.8rem;padding:10px 20px;border-radius:999px;box-shadow:0 4px 16px rgba(226,160,63,.35)}
.chip{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;white-space:nowrap}
/* viewport */
.vp{position:relative;background:#000;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vp video,.vp canvas{max-width:100%;max-height:100%;width:auto;height:auto}
/* lut bar — glass panel */
.lutbar{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 var(--glass-hi);padding:10px 12px;flex-shrink:0}
.lutbar .t{font-size:.8rem;font-weight:700;margin-bottom:8px;color:var(--acc)}
.luts{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.lut{flex-shrink:0;width:72px;text-align:center;cursor:pointer}
.lut .th{width:72px;height:72px;border-radius:18px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.lut.on .th{border-color:var(--acc);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 2px rgba(226,160,63,.45)}
.lut .nm{font-size:.6rem;color:#aaa;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow{display:flex;align-items:center;gap:10px;margin-top:10px}
.srow label{font-size:.78rem;color:#aaa;width:70px}
.srow input{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:#333}
.srow input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff}
.srow span{font-size:.78rem;width:36px;text-align:right;color:#aaa}
/* actions — glass bar, pill buttons (touch + mouse hover on PC) */
.actions{display:flex;gap:10px;padding:12px;flex-shrink:0;
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 var(--glass-hi);
  padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.actions button{flex:1;padding:15px;border-radius:999px;font-weight:700;font-size:.92rem}
.actions .dl{background:var(--acc);color:#000}
.actions .bk2{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22)}
button:hover{filter:brightness(1.08)}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:active{transform:scale(.98)}
/* home */
#home{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:480px;width:100%;margin:0 auto;overflow-y:auto}
#home h1{font-size:1.7rem;font-weight:800;text-align:center;margin-bottom:6px}
#home .sub{color:#c7c7cc;text-align:center;font-size:.85rem;margin-bottom:24px}
.hbtn{display:block;width:100%;padding:18px;border-radius:999px;font-size:1.02rem;font-weight:700;margin-bottom:14px}
.hbtn.o{background:var(--acc);color:#000;box-shadow:0 6px 20px rgba(226,160,63,.35)}
.hbtn.g{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.io-title{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#c7c7cc;text-align:center;margin:14px 0 10px}
.io-row{display:flex;gap:10px;margin-bottom:10px}
.io-row .hbtn{margin-bottom:0;padding:14px;font-size:.88rem}
/* Import/Export sheet (glass, bottom on mobile, centred card on PC) */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet .card{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 var(--glass-hi),0 20px 50px rgba(0,0,0,.5);
  border-radius:24px 24px 0 0;width:100%;max-width:520px;padding:20px;max-height:82vh;overflow-y:auto}
@media(min-width:1000px){.sheet{align-items:center}.sheet .card{border-radius:24px}}
#err{position:absolute;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px;z-index:99;font-size:.8rem;display:none;text-align:center}
.prog{height:6px;background:#222;border-radius:3px;overflow:hidden;margin:10px 12px;display:none}
.prog i{display:block;height:100%;background:var(--acc);width:0%}
</style>
</head>
<body>
<div id="app">
<div id="err"></div>

<div id="home">
  <h1>✂️ Reshi Studio</h1>
  <div class="sub">Buttery-smooth LUTs · iOS · Android · PC</div>
  <div style="text-align:center;margin-bottom:20px"><span class="chip">v7.0.0 · Liquid Glass</span></div>
  <button class="hbtn o" id="importBtn">📁 Import Video</button>
  <button class="hbtn g" id="recordBtn">🔴 Record Video</button>
  <div class="io-title">Import / Export</div>
  <div class="io-row">
    <button class="hbtn g" id="importLutBtn">🎨 Import LUT</button>
    <button class="hbtn g" id="importProjBtn">📂 Import Project</button>
  </div>
  <div class="io-row">
    <button class="hbtn g" id="exportProjBtn">💾 Export Project</button>
    <button class="hbtn g" id="ioHelpBtn">❓ Import / Export help</button>
  </div>
  <p style="color:#8a8a8e;font-size:.72rem;text-align:center;line-height:1.5;margin-top:6px">Video: MP4 / MOV / WebM · LUT: .cube · Project: .json (LUT + strength, so you can reopen a grade on any device)</p>
</div>

<div id="ed" class="hidden">
  <div class="hdr">
    <button class="bk" id="bkBtn">‹</button>
    <div class="tt"><b id="vname">Video</b><small>Tap a LUT below · v7.0.0</small></div>
    <button class="exp" id="expBtn">Export</button>
  </div>
  <div class="vp" id="vp">
    <video id="v" playsinline webkit-playsinline></video>
    <canvas id="gl" class="hidden"></canvas>
  </div>
  <div class="prog" id="prog"><i></i></div>
  <div class="lutbar">
    <div class="t">🎨 LUTs — smooth preview</div>
    <div class="luts" id="luts"></div>
    <div class="srow"><label>Strength</label><input type="range" id="str" min="0" max="100" value="100"/><span id="strv">100</span></div>
    <button id="cmpBtn" style="width:100%;padding:12px;margin-top:8px;background:#222;color:#fff;border-radius:10px;font-weight:600">👁 Hold to Compare Original</button>
  </div>
  <div class="actions">
    <button class="bk2" id="back2" style="flex:1">‹ Back</button>
    <button class="bk2" id="ioBtn" style="flex:1">⇅ Import / Export</button>
  </div>
</div>

</div>
<input type="file" id="fileIn" accept="video/*" class="hidden"/>
<input type="file" id="lutIn" accept=".cube,.CUBE" class="hidden"/>
<input type="file" id="projIn" accept=".json,application/json" class="hidden"/>
<script>
"use strict";
const $=id=>document.getElementById(id);
function err(m){const e=$('err');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2500);}
window.onerror=m=>err(String(m).slice(0,100));

const LUTS=['Cine_wedding.cube','Cinematic_Lut_V2.cube','Cinematic_Lut_V2_2.cube',
 'well-see.CUBE','Going_for_a_walk.CUBE','Once_upon_a_time.CUBE','SONY_HL.cube',
 'Sony-CL-AZ.cube','Apple-Log_XZ1.cube','DJI_OSMO_Action_4_D-Log_M_to_Rec.709_V1_2.cube',
 'FGCineVibrant.cube','Golden_Forest_35.A035_04040921_C008__1.cube',
 'lut_1.rabbit-5639615.cube','sony_lut_1.Animals_09___4K_res.cube'];

let videoUrl=null, curLUT=null, lutTex=null, lutSize=0, gl=null, prog=null, rafId=null;
let strength=100;

/* ---------- WebGL setup ---------- */
function initGL(){
  const cv=$('gl');
  gl=cv.getContext('webgl',{preserveDrawingBuffer:false,antialias:false});
  if(!gl){err('WebGL not supported');return false;}
  const vs='attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,p.y*.5+.5);gl_Position=vec4(p,0.,1.);}';
  const fs=`precision mediump float;varying vec2 v;
uniform sampler2D uV;uniform sampler2D uL;uniform float uS;uniform float uA;
vec3 fetchLUT(float r,float g,float b){
 float sz=uS;
 vec2 uv=vec2((g*sz+r+0.5)/(sz*sz),(b+0.5)/sz);
 return texture2D(uL,uv).rgb;
}
vec3 lut(vec3 c){
 float sz=uS;vec3 s=c*(sz-1.0);
 float r0=floor(s.r),g0=floor(s.g),b0=floor(s.b);
 float r1=min(r0+1.0,sz-1.0),g1=min(g0+1.0,sz-1.0),b1=min(b0+1.0,sz-1.0);
 float fr=s.r-r0,fg=s.g-g0,fb=s.b-b0;
 vec3 c000=fetchLUT(r0,g0,b0),c100=fetchLUT(r1,g0,b0);
 vec3 c010=fetchLUT(r0,g1,b0),c110=fetchLUT(r1,g1,b0);
 vec3 c001=fetchLUT(r0,g0,b1),c101=fetchLUT(r1,g0,b1);
 vec3 c011=fetchLUT(r0,g1,b1),c111=fetchLUT(r1,g1,b1);
 vec3 c00=mix(c000,c100,fr),c10=mix(c010,c110,fr);
 vec3 c01=mix(c001,c101,fr),c11=mix(c011,c111,fr);
 vec3 c0=mix(c00,c10,fg),c1=mix(c01,c11,fg);
 return mix(c0,c1,fb);
}
void main(){vec3 c=texture2D(uV,v).rgb;vec3 g=lut(c);gl_FragColor=vec4(mix(c,g,uA),1.);}`;
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))err('shader: '+gl.getShaderInfoLog(o));return o;};
  prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog);gl.useProgram(prog);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const l=gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  // video texture
  gl.vTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,gl.vTex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  return true;
}
function parseCube(txt){
  const ls=txt.split(/\r?\n/);let sz=0;const d=[];
  for(const ln of ls){const l=ln.trim();
    if(!l||l[0]==='#')continue;
    if(l.indexOf('LUT_3D_SIZE')===0){sz=parseInt(l.split(/\s+/)[1]);continue;}
    if(l.indexOf('TITLE')===0||l.indexOf('DOMAIN')===0)continue;
    const p=l.split(/\s+/).map(Number);
    if(p.length>=3&&!p.some(isNaN))d.push(p[0],p[1],p[2]);}
  return{size:sz,data:d};
}
/* Shared LUT texture upload: used by built-in LUTs and by imported .cube files */
function applyLUTData(p){
  if(!p.size||!p.data.length)return false;
  const sz=p.size,n=sz*sz*sz;
  const px=new Uint8Array(n*4);
  for(let i=0;i<n;i++){px[i*4]=Math.max(0,Math.min(255,Math.round(p.data[i*3]*255)));
    px[i*4+1]=Math.max(0,Math.min(255,Math.round(p.data[i*3+1]*255)));
    px[i*4+2]=Math.max(0,Math.min(255,Math.round(p.data[i*3+2]*255)));px[i*4+3]=255;}
  if(lutTex)gl.deleteTexture(lutTex);
  lutTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,lutTex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,sz*sz,sz,0,gl.RGBA,gl.UNSIGNED_BYTE,px);
  lutSize=sz;return true;
}
async function loadLUT(fn){
  try{
    const r=await fetch('luts/'+fn);
    if(!r.ok)return false;
    return applyLUTData(parseCube(await r.text()));
  }catch(e){return false;}
}
/* Custom (user-imported) LUTs, kept in memory for this session and in exported projects */
let customLuts=[];
function applyCustomLUT(c){
  if(!gl)initGL();
  if(!applyLUTData({size:c.size,data:c.data}))return false;
  curLUT='custom:'+c.name;buildLuts();startGL();
  $('v').muted=true;$('v').play().catch(()=>{});return true;
}
/* smooth render loop */
function renderLoop(){
  const v=$('v'),cv=$('gl');
  if(!curLUT||cv.classList.contains('hidden')){rafId=null;return;}
  if(v.readyState>=2&&v.videoWidth>0){
    if(cv.width!==v.videoWidth||cv.height!==v.videoHeight){
      cv.width=v.videoWidth;cv.height=v.videoHeight;
    }
    gl.viewport(0,0,cv.width,cv.height);
    gl.useProgram(prog);
    // video (flip Y: video top-left -> GL bottom-left)
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,gl.vTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,v);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.uniform1i(gl.getUniformLocation(prog,'uV'),0);
    // lut
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D,lutTex);
    gl.uniform1i(gl.getUniformLocation(prog,'uL'),1);
    gl.uniform1f(gl.getUniformLocation(prog,'uS'),lutSize);
    gl.uniform1f(gl.getUniformLocation(prog,'uA'),strength/100);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  rafId=requestAnimationFrame(renderLoop);
}
function startGL(){
  if(rafId)cancelAnimationFrame(rafId);
  $('v').classList.add('hidden');
  $('gl').classList.remove('hidden');
  renderLoop();
}
function stopGL(){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  $('gl').classList.add('hidden');
  $('v').classList.remove('hidden');
}

/* ---------- UI ---------- */
$('importBtn').onclick=()=>$('fileIn').click();
$('recordBtn').onclick=()=>{
  const i=document.createElement('input');i.type='file';i.accept='video/*';i.setAttribute('capture','environment');
  i.onchange=e=>{if(e.target.files[0])openV(e.target.files[0]);};i.click();
};
$('fileIn').onchange=e=>{if(e.target.files[0])openV(e.target.files[0]);e.target.value='';};
function openV(f){
  if(videoUrl)URL.revokeObjectURL(videoUrl);
  videoUrl=URL.createObjectURL(f);
  $('vname').textContent=(f.name||'Video').replace(/\.[^.]+$/,'').slice(0,28);
  const v=$('v');v.src=videoUrl;v.controls=true;v.loop=true;
  $('home').classList.add('hidden');$('ed').classList.remove('hidden');
  stopGL();curLUT=null;buildLuts();
  v.play().catch(()=>{});
}
function goBack(){
  stopGL();const v=$('v');v.pause();
  $('ed').classList.add('hidden');$('home').classList.remove('hidden');
}
$('bkBtn').onclick=goBack;$('back2').onclick=goBack;

function buildLuts(){
  const w=$('luts');w.innerHTML='';
  const mk=(nm,fn,icon)=>{
    const d=document.createElement('button');d.className='lut'+(curLUT===fn?' on':'');
    d.innerHTML='<div class="th">'+icon+'</div><div class="nm">'+nm+'</div>';
    d.onclick=()=>selectLUT(fn);
    w.appendChild(d);
  };
  mk('Original',null,'🖼');
  LUTS.forEach(fn=>mk(fn.replace(/\.cube$/i,'').replace(/_/g,' ').slice(0,12),fn,'🎨'));
  customLuts.forEach(c=>mk(c.name.replace(/\.cube$/i,'').slice(0,12),'custom:'+c.name,'✨'));
}
async function selectLUT(fn){
  if(fn&&fn.indexOf('custom:')===0){
    const c=customLuts.find(x=>'custom:'+x.name===fn);
    if(!c){err('Custom LUT no longer loaded — import it again');return;}
    curLUT=fn;buildLuts();applyCustomLUT(c);return;
  }
  curLUT=fn;buildLuts();
  if(!fn){stopGL();$('v').play().catch(()=>{});return;}
  err('Loading LUT…');
  const ok=await loadLUT(fn);
  if(!ok){err('LUT not found — upload via GitHub');curLUT=null;buildLuts();return;}
  startGL();
  $('v').muted=true;$('v').play().catch(()=>{});
}
$('str').oninput=e=>{strength=+e.target.value;$('strv').textContent=strength;};
(function(){
  const b=$('cmpBtn');let on=false;
  const set=v=>{
    if(!gl||!prog)return;
    gl.useProgram(prog);
    gl.uniform1f(gl.getUniformLocation(prog,'uA'),v?0:strength/100);
  };
  b.addEventListener('pointerdown',()=>{set(true);});
  b.addEventListener('pointerup',()=>set(false));
  b.addEventListener('pointerleave',()=>set(false));
})();

/* ---------- Import / Export ---------- */
function downloadFile(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}
function exportProject(){
  const custom=curLUT&&curLUT.indexOf('custom:')===0?customLuts.find(x=>'custom:'+x.name===curLUT):null;
  const proj={app:'Reshi Studio',version:'7.0.0',lut:curLUT,lutName:custom?custom.name:(curLUT||null),strength:strength,
    lutData:custom?{size:custom.size,data:custom.data}:null,exportedAt:new Date().toISOString(),
    note:'Video is NOT included — import the same video, then import this project to restore the grade.'};
  downloadFile('reshi-project-'+Date.now()+'.json',new Blob([JSON.stringify(proj,null,2)],{type:'application/json'}));
  err('Project exported (.json)');
}
async function importProjectFile(f){
  try{
    const proj=JSON.parse(await f.text());
    if(!proj||proj.app!=='Reshi Studio')throw new Error('Not a Reshi Studio project');
    strength=typeof proj.strength==='number'?Math.max(0,Math.min(100,proj.strength)):100;
    $('str').value=strength;$('strv').textContent=strength;
    if(proj.lutData&&proj.lutName){
      const c={name:proj.lutName,size:proj.lutData.size,data:proj.lutData.data};
      if(!customLuts.find(x=>x.name===c.name))customLuts.push(c);
      if($('v').src)applyCustomLUT(c);else{curLUT='custom:'+c.name;buildLuts();}
    }else if(proj.lut){
      if($('v').src)await selectLUT(proj.lut);else{curLUT=proj.lut;buildLuts();}
    }else{curLUT=null;buildLuts();}
    err('Project imported — grade restored');
  }catch(e){err('Project import failed: '+e.message);}
}
$('importLutBtn').onclick=()=>$('lutIn').click();
$('importProjBtn').onclick=()=>$('projIn').click();
$('exportProjBtn').onclick=exportProject;
$('lutIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const p=parseCube(await f.text());
    if(!p.size||!p.data.length){err('That .cube file could not be read');return;}
    const c={name:f.name,size:p.size,data:p.data};
    const old=customLuts.findIndex(x=>x.name===c.name);
    if(old>=0)customLuts[old]=c;else customLuts.push(c);
    if($('v').src)applyCustomLUT(c);else{curLUT='custom:'+c.name;buildLuts();}
    err('LUT imported: '+f.name);
  }catch(ex){err('LUT import failed: '+ex.message);}
};
$('projIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importProjectFile(f);};
function openIOSheet(){
  const m=document.createElement('div');m.className='sheet';
  m.innerHTML='<div class="card"><h3 style="margin-bottom:6px">⇅ Import / Export</h3>'
    +'<p style="color:#c7c7cc;font-size:.82rem;line-height:1.5;margin-bottom:16px">Import a video or a .cube LUT, reopen a saved grade (.json), export the graded video, or save just the grade as a project file. A project file does <b>not</b> contain the video — import the same video first, then the project.</p>'
    +'<button class="hbtn o" id="ioVid" style="margin-bottom:10px">📁 Import Video</button>'
    +'<button class="hbtn g" id="ioLut" style="margin-bottom:10px">🎨 Import LUT (.cube)</button>'
    +'<button class="hbtn g" id="ioProj" style="margin-bottom:10px">📂 Import Project (.json)</button>'
    +'<button class="hbtn g" id="ioExpProj" style="margin-bottom:10px">💾 Export Project (.json)</button>'
    +'<button class="hbtn o" id="ioExpVid" style="margin-bottom:10px">⬇ Export Video</button>'
    +'<button class="hbtn g" id="ioX">Close</button></div>';
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.querySelector('#ioX').onclick=close;m.onclick=e=>{if(e.target===m)close();};
  m.querySelector('#ioVid').onclick=()=>{close();$('fileIn').click();};
  m.querySelector('#ioLut').onclick=()=>{close();$('lutIn').click();};
  m.querySelector('#ioProj').onclick=()=>{close();$('projIn').click();};
  m.querySelector('#ioExpProj').onclick=()=>{close();exportProject();};
  m.querySelector('#ioExpVid').onclick=()=>{close();openExport();};
}
$('ioBtn').onclick=openIOSheet;
$('ioHelpBtn').onclick=openIOSheet;

/* ---------- export ---------- */
$('expBtn').onclick=openExport;
function openExport(){
  const v=$('v');if(!v.src){err('Import a video first');return;}
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center';
  m.innerHTML='<div style="background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.28);border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:20px;max-height:80vh;overflow-y:auto">'
  +'<h3 style="margin-bottom:16px">Export</h3>'
  +'<div style="margin-bottom:14px"><div style="font-size:.8rem;color:#aaa;margin-bottom:8px">Resolution</div>'
  +'<div style="display:flex;gap:8px" id="exRes">'
  +'<button data-r="1080" style="flex:1;padding:12px;background:#E2A03F;color:#000;border-radius:10px;font-weight:700">1080p</button>'
  +'<button data-r="2k" style="flex:1;padding:12px;background:#222;color:#fff;border-radius:10px">2K</button>'
  +'<button data-r="4k" style="flex:1;padding:12px;background:#222;color:#fff;border-radius:10px">4K</button>'
  +'</div></div>'
  +'<div style="margin-bottom:14px"><div style="font-size:.8rem;color:#aaa;margin-bottom:8px">Frame Rate: <span id="exFpsV">30</span> fps</div>'
  +'<input type="range" id="exFps" min="10" max="60" value="30" style="width:100%"></div>'
  +'<div style="margin-bottom:14px"><div style="font-size:.8rem;color:#aaa;margin-bottom:8px">Bitrate</div>'
  +'<div style="display:flex;gap:8px" id="exBr">'
  +'<button data-b="6" style="flex:1;padding:12px;background:#222;color:#fff;border-radius:10px">Low</button>'
  +'<button data-b="12" style="flex:1;padding:12px;background:#E2A03F;color:#000;border-radius:10px;font-weight:700">Med</button>'
  +'<button data-b="24" style="flex:1;padding:12px;background:#222;color:#fff;border-radius:10px">High</button>'
  +'</div></div>'
  +'<div style="margin-bottom:16px"><div style="font-size:.8rem;color:#aaa;margin-bottom:8px">Format</div>'
  +'<div style="display:flex;gap:8px"><button style="flex:1;padding:12px;background:#E2A03F;color:#000;border-radius:10px;font-weight:700">MP4</button></div>'
  +'<div style="font-size:.7rem;color:#666;margin-top:6px">MP4 if supported, else WebM</div></div>'
  +'<div class="prog" id="exProg" style="display:none;margin:10px 0"><i style="display:block;height:100%;background:#E2A03F;width:0%"></i></div>'
  +'<button id="exGo" style="width:100%;padding:16px;background:#E2A03F;color:#000;border:none;border-radius:14px;font-weight:700;font-size:1rem;margin-bottom:10px">Export Video</button>'
  +'<button id="exX" style="width:100%;padding:14px;background:#222;color:#fff;border:none;border-radius:14px">Cancel</button>'
  +'</div>';
  document.body.appendChild(m);
  let res='1080',br=12;
  m.querySelector('#exFps').oninput=e=>m.querySelector('#exFpsV').textContent=e.target.value;
  m.querySelectorAll('#exRes button').forEach(b=>b.onclick=()=>{
    m.querySelectorAll('#exRes button').forEach(x=>{x.style.background='#222';x.style.color='#fff';x.style.fontWeight='400';});
    b.style.background='#E2A03F';b.style.color='#000';b.style.fontWeight='700';res=b.dataset.r;});
  m.querySelectorAll('#exBr button').forEach(b=>b.onclick=()=>{
    m.querySelectorAll('#exBr button').forEach(x=>{x.style.background='#222';x.style.color='#fff';x.style.fontWeight='400';});
    b.style.background='#E2A03F';b.style.color='#000';b.style.fontWeight='700';br=+b.dataset.b;});
  m.querySelector('#exX').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove();};
  m.querySelector('#exGo').onclick=()=>doExport(m,res,+m.querySelector('#exFps').value,br);
}
async function doExport(m,res,fps,brMbps){
  const v=$('v');if(!v.src){err('Import a video first');return;}
  const pr=m.querySelector('#exProg');pr.style.display='block';const bar=pr.querySelector('i');
  const goBtn=m.querySelector('#exGo');goBtn.disabled=true;goBtn.textContent='Rendering…';
  try{
    let W,H;
    if(res==='4k'){W=3840;H=2160;}else if(res==='2k'){W=2560;H=1440;}else{W=1920;H=1080;}
    // keep aspect from source
    const sw=v.videoWidth||16,sh=v.videoHeight||9;
    if(sw>sh){H=Math.round(W*sh/sw);}else{W=Math.round(H*sw/sh);}
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const cx=cv.getContext('2d');
    const stream=cv.captureStream(fps);
    // try MP4, fallback to WebM
    let mime='video/webm';
    if(MediaRecorder.isTypeSupported('video/mp4'))mime='video/mp4';
    const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:brMbps*1e6});
    const ch=[];rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data);};
    const done=new Promise(r=>rec.onstop=r);
    rec.start();
    // render with LUT if active: draw GL canvas, else video
    const srcCv=curLUT&&lutTex?$('gl'):null;
    v.currentTime=0;v.muted=false;
    try{await v.play();}catch(e){}
    const dur=v.duration||5,t0=Date.now();
    await new Promise(res=>{
      const iv=setInterval(()=>{
        const p=Math.min(1,(Date.now()-t0)/(dur*1000));
        bar.style.width=(p*100)+'%';
        if(srcCv&&srcCv.width>0)cx.drawImage(srcCv,0,0,W,H);
        else if(v.videoWidth>0)cx.drawImage(v,0,0,W,H);
        if(v.ended||Date.now()-t0>dur*1000+1500){clearInterval(iv);res();}
      },Math.max(16,1000/fps));
    });
    rec.stop();await done;
    const ext=mime.includes('mp4')?'mp4':'webm';
    const blob=new Blob(ch,{type:mime});
    const url=URL.createObjectURL(blob);
    m.remove();
    // Show result with video player (mobile: long-press to save)
    const rm=document.createElement('div');
    rm.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
    rm.innerHTML='<div style="background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.28);border-radius:24px;padding:20px;width:100%;max-width:400px">'
      +'<h3 style="margin-bottom:12px">✓ Exported ('+ext.toUpperCase()+')</h3>'
      +'<video src="'+url+'" controls playsinline style="width:100%;border-radius:10px;background:#000"></video>'
      +'<p style="color:#aaa;font-size:.8rem;margin:12px 0;line-height:1.5">📱 <b>iPhone:</b> long-press video → Save to Photos<br>🤖 <b>Android:</b> tap ⋮ → Download</p>'
      +'<a href="'+url+'" download="reshi-'+Date.now()+'.'+ext+'" style="display:block;text-align:center;padding:14px;background:#E2A03F;color:#000;border-radius:12px;font-weight:700;text-decoration:none;margin-bottom:10px">⬇ Try Download</a>'
      +'<button id="rmX" style="width:100%;padding:12px;background:#222;color:#fff;border:none;border-radius:12px">Close</button></div>';
    document.body.appendChild(rm);
    rm.querySelector('#rmX').onclick=()=>{rm.remove();URL.revokeObjectURL(url);};
    rm.onclick=e=>{if(e.target===rm){rm.remove();}};
  }catch(e){err('Export failed: '+e.message);goBtn.disabled=false;goBtn.textContent='Export Video';}
}

initGL();buildLuts();
